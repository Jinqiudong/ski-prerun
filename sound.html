<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <title>声音样品室 · 雪场预滑</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/sound.css?v=1">
  <link rel="stylesheet" href="src/styles/paper.css?v=1">
</head>
<body>
  <!-- The sound lab: every sound of the ride, live with its knobs, next to real recordings and music
       candidates. Tick what to use; the picks are listed at the bottom to copy. -->
  <header><small>SOUND LAB</small><h1 data-t="声音样品室">声音样品室</h1>
    <p id="intro" data-t="intro">每一个声音都能播放和对比：「合成」是现在游戏里的，拖动滑块听它怎么变；「真实录音」是可以替换的候选。一次只播一个，觉得对的就勾「选这个」，最后把下面的选择复制给我们。</p></header>
  <main id="groups">加载中…</main>
  <section id="picks" class="card"><h2 data-t="我的选择">我的选择</h2><pre></pre><button id="copy" data-t="复制">复制</button></section>
  <footer data-t="footer">真实录音来自 Freesound（CC0）和 OpenGameArt（CC0），每条的作者、许可和来源写在条目下面和 assets/audio/lab/manifest.json 里。</footer>
  <script type="module" src="src/audio/lab.js?v=9"></script>
</body>
</html>
