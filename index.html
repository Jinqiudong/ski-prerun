<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- The shell: the app's pages load in the frame below; the 对讲机 (src/core/voice.js) lives up here for the
       whole visit, so changing pages never drops the voice. Its address is the page's after "#" (src/core/frame.js). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="雪场预滑">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f7fe8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>雪场预滑</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e9edf2; overscroll-behavior: none; }
    /* Inside a frame a page's env(safe-area-inset-*) is 0, so the frame itself keeps out of the notch and the home bar. */
    #app { position: fixed; top: env(safe-area-inset-top); left: env(safe-area-inset-left); border: 0; display: block; background: #e9edf2;
      width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right)); height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  </style>
  <script src="src/core/frame.js?v=1"></script>
</head>
<body>
  <iframe id="app" title="雪场预滑" allow="microphone; autoplay; fullscreen; accelerometer; gyroscope; magnetometer; screen-wake-lock; clipboard-write; web-share"></iframe>
  <script>
    // The page first, before the shell's modules arrive: the address's page, or the start page.
    document.getElementById("app").src = prerunShell.appSrc(location.hash, location.search);
  </script>
  <script type="module" src="src/core/shell.js?v=7"></script>
  <noscript><a href="start.html">雪场预滑 ›</a></noscript>
</body>
</html>
