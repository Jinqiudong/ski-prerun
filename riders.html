<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>雪友形象 · 样稿</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe7f1; font-family: -apple-system, "PingFang SC", sans-serif; color: #f4f7fb; touch-action: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .glass { background: rgba(14, 22, 34, .62); border: 1px solid rgba(255, 255, 255, .16); border-radius: 14px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    #top { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; padding: 10px 12px; }
    #top b { font-size: 16px; }
    #top p { margin: 4px 0 0; font-size: 12px; color: #b9c4d3; }
    #pick { position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 10px; }
    #pick button { font: inherit; font-size: 14px; font-weight: 600; color: #f4f7fb; padding: 9px 14px; border-radius: 999px; cursor: pointer; }
    #pick button.on { background: #2f7fe8; border-color: #2f7fe8; }
    #ride { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom)); font: inherit; font-size: 15px; font-weight: 600; color: #fff; background: #2f7fe8; border: 0; border-radius: 12px; padding: 10px 18px; cursor: pointer; }
    #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 12px 18px; }
    #credit { position: fixed; right: 6px; bottom: 2px; font-size: 9px; color: rgba(30, 40, 55, .6); pointer-events: none; }
  </style>
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="top" class="glass"><b>🏂 雪友形象 · 样稿</b><p>按衣服、头盔、雪镜和板子来认人，不用脸。点名字看单人，拖动转一圈。</p></div>
  <button id="ride">坐 American Flyer 看看 ›</button>
  <div id="pick"></div>
  <div id="status" class="glass">加载中…</div>
  <div id="credit">人物底模 Quaternius (CC0)</div>
  <script type="module">
    import * as THREE from "three";
    import { RIDERS, buildRider, standPose, board } from "./avatar.js?v=1";
    const $ = (id) => document.getElementById(id);
    const renderer = new THREE.WebGLRenderer({ canvas: $("c"), antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdfe7f1);
    scene.fog = new THREE.Fog(0xdfe7f1, 12, 30);
    const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
    addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    scene.add(new THREE.HemisphereLight(0xe8f0ff, 0x9aa6bd, 1.1));
    const sun = new THREE.DirectionalLight(0xfff2e0, 2.6);
    sun.position.set(-3, 6, 5);
    sun.castShadow = true;
    sun.shadow.mapSize.setScalar(2048);
    Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 });
    scene.add(sun);
    const snow = new THREE.Mesh(new THREE.CircleGeometry(14, 64), new THREE.MeshStandardMaterial({ color: 0xf6f8fb, roughness: 0.9 }));
    snow.rotation.x = -Math.PI / 2;
    snow.receiveShadow = true;
    scene.add(snow);

    const ids = Object.keys(RIDERS), riders = [];
    const stage = new THREE.Group();
    scene.add(stage);
    for (const [i, id] of ids.entries()) {
      const r = await buildRider(RIDERS[id]);
      standPose(r);
      const b = board(RIDERS[id].board);
      b.rotation.x = Math.PI / 2 - 0.12; // stood on its tail beside the rider
      b.position.set(-0.42, 0.76, 0.05);
      r.add(b);
      r.position.x = (i - (ids.length - 1) / 2) * 1.25;
      stage.add(r);
      riders.push(r);
    }
    $("status").remove();
    let focus = -1, spin = 0, drag = null;
    const pick = $("pick");
    const all = document.createElement("button");
    all.className = "glass on"; all.textContent = "全部";
    pick.append(all);
    const buttons = [all];
    all.onclick = () => select(-1);
    ids.forEach((id, i) => {
      const b = document.createElement("button");
      b.className = "glass"; b.textContent = RIDERS[id].name;
      b.onclick = () => select(i);
      pick.append(b); buttons.push(b);
    });
    function select(i) {
      focus = i;
      buttons.forEach((b, k) => b.classList.toggle("on", k === i + 1));
      $("ride").style.display = i < 0 ? "none" : "";
    }
    select(new URLSearchParams(location.search).has("one") ? 0 : -1);
    $("ride").onclick = () => (location.href = `look.html?rider=${ids[Math.max(0, focus)]}`);
    renderer.domElement.addEventListener("pointerdown", (e) => (drag = { x: e.clientX, s: spin }));
    addEventListener("pointermove", (e) => { if (drag) spin = drag.s + (e.clientX - drag.x) / 120; });
    addEventListener("pointerup", () => (drag = null));
    window.__riders = { riders, select, set spin(v) { spin = v; } };
    let last = performance.now();
    renderer.setAnimationLoop((now) => {
      const dt = (now - last) / 1000; last = now;
      if (!drag && !new URLSearchParams(location.search).has("still")) spin += dt * 0.4;
      const target = focus < 0 ? new THREE.Vector3(0, 0.9, 0) : riders[focus].position.clone().setY(0.95);
      const dist = focus < 0 ? 7.8 : 3.2;
      riders.forEach((r, i) => { r.rotation.y = focus < 0 || i === focus ? spin : 0; r.visible = focus < 0 || i === focus; });
      camera.position.lerp(target.clone().add(new THREE.Vector3(0, 0.55, dist)), 0.08);
      camera.lookAt(target);
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
