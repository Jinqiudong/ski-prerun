<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>雪场预滑</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfdcea; font-family: -apple-system, "PingFang SC", sans-serif; color: #f4f7fb; touch-action: none; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .glass { background: rgba(14, 22, 34, .62); border: 1px solid rgba(255, 255, 255, .16); border-radius: 14px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    #top { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; padding: 10px 12px; }
    #top b { font-size: 16px; }
    #top p { margin: 4px 0 0; font-size: 12px; color: #b9c4d3; }
    #styles { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 10px; }
    #styles button { font: inherit; font-size: 15px; font-weight: 600; color: #f4f7fb; padding: 10px 16px; border-radius: 999px; cursor: pointer; }
    #styles button.on { background: #2f7fe8; border-color: #2f7fe8; }
    #bubble { position: fixed; right: 10px; top: calc(118px + env(safe-area-inset-top)); font: inherit; font-size: 13px; color: #f4f7fb; padding: 8px 12px; border-radius: 999px; cursor: pointer; }
    #back { float: right; color: #9fc3ff; font-size: 13px; text-decoration: none; }
    #pads { position: fixed; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom)); display: flex; justify-content: center; align-items: center; gap: 14px; pointer-events: none; }
    #pads button { pointer-events: auto; font: inherit; color: #f4f7fb; cursor: pointer; }
    #skip { padding: 9px 14px; border-radius: 999px; font-size: 14px; }
    #fast { width: 74px; height: 74px; border-radius: 50%; font-size: 14px; font-weight: 600; -webkit-user-select: none; user-select: none; touch-action: none; }
    #arrive { position: fixed; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; padding: 14px 16px; }
    #arrive b { font-size: 18px; }
    #arrive p { margin: 4px 0 10px; font-size: 13px; color: #b9c4d3; }
    #arrive .row { display: grid; gap: 8px; }
    #arrive .btn { display: block; text-align: center; font: inherit; font-size: 15px; color: #f4f7fb; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 12px; padding: 10px; text-decoration: none; cursor: pointer; }
    #arrive .go { background: #2f7fe8; border-color: #2f7fe8; font-weight: 600; }
    [hidden] { display: none !important; }
    #skiHud { position: fixed; left: 12px; right: 12px; bottom: calc(18px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; padding: 10px 14px; }
    #skiHud .nums { display: flex; justify-content: space-between; font-size: 13px; color: #b9c4d3; }
    #skiHud .nums b { font-size: 22px; color: #fff; }
    #skiHud p { margin: 6px 0 0; font-size: 15px; }
    #skiHud #skiWhere { font-size: 12px; color: #b9c4d3; margin-top: 4px; }
    #skiHud small { font-size: 13px; color: #d5deea; }
    /* The 3D map is drawn into this circle by WebGL; the element gives it its place, frame and tap. */
    /* The corner map: a small framed square of the trail map; tap it for the full map. */
    #minimap { position: fixed; right: 10px; top: calc(120px + env(safe-area-inset-top)); width: 128px; height: 128px; border-radius: 14px; border: 3px solid #fff8ea; box-shadow: 0 0 0 2px #8a5a35, 0 4px 12px rgba(0,0,0,.35); box-sizing: border-box; cursor: pointer; background: #f4f1ea; }
    /* The full map: pan, pinch, tap a place, confirm. */
    #bigMap { position: fixed; inset: 0; z-index: 8; background: #e9edf2; }
    #bigMap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #bigMap .bar { position: absolute; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top)); display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 14px; background: rgba(255,248,234,.95); color: #3b2a1a; box-shadow: 0 0 0 2px #8a5a35, 0 4px 12px rgba(0,0,0,.25); font-size: 14px; }
    #bigMap .bar b { flex: 1; }
    #bigMap button { font: inherit; font-size: 14px; color: #3b2a1a; background: #fff; border: 2px solid #8a5a35; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
    #bigMap .pickCard { position: absolute; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; padding: 12px 14px; border-radius: 16px; background: rgba(255,248,234,.97); color: #3b2a1a; box-shadow: 0 0 0 2px #8a5a35, 0 6px 16px rgba(0,0,0,.3); display: grid; gap: 8px; }
    #bigMap .pickCard b { font-size: 17px; } #bigMap .pickCard small { color: #7a5a3a; }
    #bigMap .pickCard .two { display: flex; gap: 8px; } #bigMap .pickCard .two button { flex: 1; padding: 10px; }
    #bigMap .pickCard .go { background: #7a4b25; color: #fff8ea; border-color: #7a4b25; font-weight: 600; }
    #runTags .rtag.me { background: none; border: 0; box-shadow: none; padding: 0; }
    #runTags .rtag.me img, #runTags .rtag.me span { height: 72px; display: block; filter: drop-shadow(0 3px 3px rgba(0,0,0,.35)); animation: hop 0.9s ease-in-out infinite; font-size: 40px; line-height: 72px; text-align: center; }
    @keyframes hop { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-9px); } }
    body.picking #credit { display: none; }
    #runTags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .rtag { position: absolute; left: 0; top: 0; pointer-events: auto; font: inherit; font-size: 13px; font-weight: 600; color: #f4f7fb; background: rgba(14,22,34,.78); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px 10px; white-space: nowrap; cursor: pointer; }
    .rtag.on { background: #2f7fe8; border-color: #fff; z-index: 2; }
    .rtag.leg { pointer-events: none; font-size: 12px; padding: 3px 8px; }
    .rtag.via { pointer-events: none; background: rgba(120,84,8,.9); border-color: #f2b632; }
    .rtag.pin { z-index: 2; font-size: 13px; background: rgba(255,255,255,.92); color: #142033; border-color: #f2b632; }
    .rtag small { font-weight: 500; opacity: .75; margin-left: 2px; }
    .rtag.dest { pointer-events: none; z-index: 3; font-size: 14px; background: #f2b632; color: #1d1606; border-color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
    #pickTabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
    #pickTabs button { font: inherit; font-size: 13px; font-weight: 600; color: #f4f7fb; background: rgba(14,22,34,.7); border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 6px 12px; cursor: pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    #pickTabs button.on { background: #fff; color: #142033; }
    .rcard .r1 .t { margin-left: auto; font-size: 13px; color: #f2b632; font-weight: 600; }
    .rcard .steps { font-size: 13px; line-height: 1.5; color: #e9f1ff; }
    .rcard .steps .lift { color: #f2b632; font-weight: 600; }
    .rcard .warn { color: #ffb4a8; }
    .rcard small.to { color: #f2d28a; }
    #pick { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); }
    #runCards { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 calc(50vw - min(39vw, 160px)); scrollbar-width: none; touch-action: pan-x; }
    #runCards::-webkit-scrollbar { display: none; }
    .rcard { flex: 0 0 min(78vw, 320px); scroll-snap-align: center; box-sizing: border-box; padding: 10px 12px; border-radius: 16px; background: rgba(14,22,34,.72); border: 1px solid rgba(255,255,255,.16); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); display: grid; gap: 4px; opacity: .8; transform: scale(.96); transition: transform .25s, opacity .25s; }
    .rcard.on { opacity: 1; transform: none; border-color: #2f7fe8; }
    .rcard .r1 { display: flex; align-items: center; gap: 6px; font-size: 16px; }
    .rcard small { color: #b9c4d3; font-size: 12px; }
    .rcard canvas { width: 100%; height: 40px; }
    .rcard .go { margin-top: 4px; font: inherit; font-size: 15px; font-weight: 600; color: #fff; background: #2f7fe8; border: 0; border-radius: 10px; padding: 9px; cursor: pointer; }
    .rcard:not(.on) .go { background: rgba(47,127,232,.45); }
    .pickLinks { display: flex; justify-content: center; gap: 18px; margin-top: 8px; font-size: 13px; }
    .pickLinks a { color: #e9f1ff; text-decoration: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
    .lv { display: inline-block; width: 11px; height: 11px; margin-right: 4px; }
    .lv.easy { background: #22b35a; border-radius: 50%; } .lv.intermediate { background: #1f6fe5; }
    .lv.advanced, .lv.expert { background: #111; transform: rotate(45deg) scale(.85); outline: 1px solid #fff; }
    .lv.expert { box-shadow: 7px -7px 0 #111; margin-right: 10px; }
    #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 12px 18px; }
    /* The miniature runs to the screen's edges while choosing; the edges blur and fade into the backdrop. */
    #vignette { position: fixed; inset: 0; pointer-events: none; display: none; background: radial-gradient(ellipse 72% 62% at 50% 46%, rgba(233,237,242,0) 58%, rgba(233,237,242,.55) 82%, rgba(233,237,242,.92) 100%); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); -webkit-mask-image: radial-gradient(ellipse 72% 62% at 50% 46%, transparent 55%, #000 85%); mask-image: radial-gradient(ellipse 72% 62% at 50% 46%, transparent 55%, #000 85%); }
    body.picking #vignette { display: block; }
    .rtag.me { pointer-events: none; z-index: 4; background: #e8453c; border-color: #fff; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
    #turnCue { position: fixed; left: 12px; top: calc(118px + env(safe-area-inset-top)); max-width: calc(100vw - 170px); transform-origin: left center; display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 12px; border-radius: 16px; background: rgba(242,182,50,.95); color: #1d1606; box-shadow: 0 3px 12px rgba(0,0,0,.3); }
    #turnCue .arr { font-size: 34px; line-height: 1; font-weight: 700; }
    #turnCue b { display: block; font-size: 17px; }
    #turnCue small { font-size: 12px; }
    #turnCue.pop { animation: pop .5s ease-out; }
    @keyframes pop { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
    /* A lift you can take, as you come up to it. */
    #liftOffer { position: fixed; left: 12px; right: 12px; bottom: calc(150px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; padding: 12px 14px; display: grid; gap: 8px; }
    #liftOffer b { font-size: 17px; }
    #liftOffer .two { display: flex; gap: 8px; }
    #liftOffer button, .sheet button.opt { flex: 1; font: inherit; font-size: 15px; color: #f4f7fb; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); border-radius: 12px; padding: 10px; cursor: pointer; text-align: center; }
    #liftOffer button.go, .sheet button.opt.go { background: #2f7fe8; border-color: #2f7fe8; font-weight: 600; }
    /* Sheets: choosing again from where you are; the route's written guide. */
    .sheet { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; max-height: 76vh; overflow-y: auto; padding: 14px 16px; border-radius: 18px; -webkit-overflow-scrolling: touch; touch-action: pan-y; z-index: 5; }
    .sheet h2 { margin: 0 0 4px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    .sheet h2 button { background: none; border: 0; color: #f4f7fb; font-size: 24px; cursor: pointer; }
    .sheet h3 { margin: 12px 0 6px; font-size: 13px; color: #b9c4d3; font-weight: 500; }
    .sheet p, .sheet li { font-size: 14px; line-height: 1.55; margin: 0; }
    .sheet ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
    .sheet .warn { color: #ffcf8a; }
    .sheet .opts { display: grid; gap: 8px; }
    .sheet button.opt { text-align: left; }
    .sheet button.opt small { display: block; color: #b9c4d3; font-size: 12px; font-weight: 400; }
    .rcard .doc { font: inherit; font-size: 13px; color: #cfe0ff; background: none; border: 0; padding: 2px 0; text-align: left; cursor: pointer; }
    /* The route guide as a paper roadbook: two wooden rods, the paper unrolls between them; bigger or smaller. */
    #guide.scroll { background: none; border: 0; padding: 0; -webkit-backdrop-filter: none; backdrop-filter: none; overflow: visible; max-height: none; filter: drop-shadow(0 8px 18px rgba(0,0,0,.45)); }
    #guide .rod { position: relative; height: 18px; margin: 0 -6px; border-radius: 9px; background: linear-gradient(#5c3516, #b47b43 40%, #e0ae73 55%, #8a5428 75%, #4d2b11); z-index: 1; }
    #guide .rod::before, #guide .rod::after { content: ""; position: absolute; top: -4px; width: 14px; height: 26px; border-radius: 7px; background: linear-gradient(#3b200b, #8d5a2c 50%, #3b200b); }
    #guide .rod::before { left: -8px; } #guide .rod::after { right: -8px; }
    #guide .paper { max-height: 0; overflow: hidden; transition: max-height .65s cubic-bezier(.2,.8,.2,1); margin: -4px 4px; background: radial-gradient(ellipse at 50% 0%, rgba(255,250,235,.7), transparent 60%), linear-gradient(90deg, #d9c29a, #f2e4c4 8%, #f6ead0 50%, #f2e4c4 92%, #d9c29a); color: #3b2a1a; font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif; }
    #guide.open .paper { max-height: 64vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #guide.open.big .paper { max-height: 84vh; }
    #guide .ink { padding: 14px 18px 16px; font-size: 14px; transition: font-size .3s; }
    #guide.big .ink { font-size: 16.5px; }
    #guide .ink h2 { font-size: 1.3em; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; color: #2a1b0e; border-bottom: 1px solid rgba(90,60,30,.35); padding-bottom: 6px; }
    #guide .ink h2 button { background: none; border: 0; color: #5b3b1c; font-size: 1.3em; cursor: pointer; }
    #guide .ink h3 { color: #7a5230; font-size: .92em; margin: 14px 0 6px; letter-spacing: .1em; }
    #guide .ink p, #guide .ink li { font-size: 1em; line-height: 1.6; }
    #guide .ink .warn { color: #a63c16; }
    #guide .ink .opts { display: flex; gap: 8px; margin-top: 14px; }
    #guide .ink button.opt { color: #3b2a1a; background: rgba(120,80,40,.1); border: 1px solid rgba(120,80,40,.4); font-family: inherit; text-align: center; }
    #guide .ink button.opt.go { background: #7a4b25; border-color: #7a4b25; color: #fbf1dc; }
    /* The enlarged corner map: tap anywhere on it to go there. */
    #mapBar { position: fixed; right: 10px; top: calc(388px + env(safe-area-inset-top)); width: 260px; display: flex; gap: 6px; align-items: center; font-size: 12px; color: #f4f7fb; background: rgba(14,22,34,.72); border-radius: 12px; padding: 6px 8px; box-sizing: border-box; }
    #mapBar span { flex: 1; }
    #mapBar button { font: inherit; font-size: 12px; color: #f4f7fb; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px 8px; cursor: pointer; }
    #flash { position: fixed; inset: 0; background: #f4f6f9; opacity: 0; pointer-events: none; }
    #flash.go { animation: flash .7s ease-out; }
    @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
    #credit { position: fixed; right: 6px; bottom: 2px; font-size: 9px; color: rgba(30, 40, 55, .6); pointer-events: none; }
  </style>
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>

<body>
  <canvas id="c"></canvas>
  <div id="vignette"></div>
  <div id="top" class="glass"><b>🚡 <span id="liftName"></span></b> <a id="back" href="mountain/">← 沙盘</a><p id="desc"></p><p id="weather"></p></div>
  <button id="bubble" class="glass">🫧 放下防风罩</button>
  <div id="pads"><button id="skip" class="glass" hidden>跳到山顶 ⏭</button><button id="fast" class="glass" hidden>按住<br>加速</button></div>
  <div id="runTags"></div>
  <div id="pick" hidden><div id="pickTabs"></div><div id="runCards"></div><div class="pickLinks"><a id="kindBtn" href="javascript:void 0"></a><a href="mountain/">← 回沙盘</a><a href="javascript:location.reload()">再坐一次</a></div></div>
  <div id="skiHud" class="glass" hidden><div class="nums"><span><b id="skiSpeed">0</b> km/h</span><span>还剩 <b id="skiLeft"></b></span></div><p id="skiWhere"></p><p id="skiCue"></p></div>
  <div id="turnCue" hidden></div>
  <canvas id="minimap" width="256" height="256" hidden></canvas>
  <div id="arrive" class="glass" hidden><b id="arriveTitle"></b><p id="arriveNote"></p>
    <div class="row" id="arriveRow"><a class="btn go" id="skiDown">从这里滑下去（旧版画面）›</a><a class="btn" href="mountain/">回沙盘选下一条</a><button class="btn" id="again">再坐一次</button></div></div>
  <div id="bigMap" hidden><canvas></canvas><div class="bar"><b>🗺 雪场地图 · 点一个地方，选从哪里出发</b><button id="mapMe">回到我</button><button id="mapMore">更多</button><button id="mapClose" aria-label="关闭">×</button></div><div class="pickCard" hidden></div></div>
  <div id="liftOffer" class="glass" hidden></div>
  <div id="rePlan" class="glass sheet" hidden></div>
  <div id="guide" class="sheet scroll" hidden></div>
  <div id="flash"></div>
  <div id="status" class="glass">加载中…</div>
  <div id="credit">雪道和缆车 © OpenStreetMap 贡献者 · 地形 AWS Terrain Tiles · 雪地材质和云杉枝叶 Poly Haven (CC0)</div>
  <script type="module" src="look.js?v=57"></script>
</body>
</html>
