    body.riding #credit { display: none; } body.menuOpen #rideBar { visibility: hidden; }
    /* the menu: the app's four tabs as a pill, this ride's tools above it */
    #menu { left: 10px !important; right: 10px !important; bottom: calc(10px + env(safe-area-inset-bottom)) !important; top: auto !important; background: none !important; box-shadow: none !important; padding: 0 !important; }
    #menu h2 { display: none; }
    #menu .opts { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    #menu .opt { display: grid !important; justify-items: center; gap: 2px; padding: 8px 4px !important; border: 0 !important; border-radius: 18px !important; background: rgba(253,251,246,.95) !important; box-shadow: 0 4px 10px rgba(40,50,70,.15); font: 13px "Noto Serif SC", serif !important; color: #22344d !important; text-align: center; }
    #menu .opt img { width: 30px; height: 30px; } #menu .opt small { display: none !important; }
    #menu .navrow { order: 2; display: flex !important; padding: 7px; border-radius: 40px; background: rgba(253,251,246,.92); box-shadow: 0 10px 26px rgba(40,50,70,.22); margin: 0 !important; gap: 0 !important; }
    #menu .navrow a { flex: 1; border: 0 !important; background: none !important; border-radius: 32px !important; padding: 6px 0 5px !important; font: 12px "Noto Serif SC", serif !important; color: #4a453f !important; }
    #menu .navrow a.on { background: #6f879c !important; color: #fdfbf6 !important; }
    #menu > div { display: flex; flex-direction: column; } #menuDim { position: fixed; inset: 0; z-index: 9; background: rgba(30,40,55,.25); }

  <canvas id="c"></canvas>
  <div id="vignette"></div>

  </div>
  <button id="bubbleHint" hidden aria-label="防风罩"><img src="assets/icons/windy.png?v=1" alt=""><span hidden></span></button>

    <div class="row" id="arriveRow"><a class="btn" href="mountain/">回沙盘选下一条</a><button class="btn" id="again">再坐一次</button></div></div>
