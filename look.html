<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>坐缆车画面样稿 · A / C</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfdcea; font-family: -apple-system, "PingFang SC", sans-serif; color: #f4f7fb; touch-action: none; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .glass { background: rgba(14, 22, 34, .62); border: 1px solid rgba(255, 255, 255, .16); border-radius: 14px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    #top { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; padding: 10px 12px; }
    #top b { font-size: 16px; }
    #top p { margin: 4px 0 0; font-size: 12px; color: #b9c4d3; }
    #styles { position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 10px; }
    #styles button { font: inherit; font-size: 15px; font-weight: 600; color: #f4f7fb; padding: 10px 16px; border-radius: 999px; cursor: pointer; }
    #styles button.on { background: #2f7fe8; border-color: #2f7fe8; }
    #bubble { position: fixed; right: 10px; top: calc(118px + env(safe-area-inset-top)); font: inherit; font-size: 13px; color: #f4f7fb; padding: 8px 12px; border-radius: 999px; cursor: pointer; }
    #back { float: right; color: #9fc3ff; font-size: 13px; text-decoration: none; }
    #pads { position: fixed; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom)); display: flex; justify-content: center; align-items: center; gap: 14px; pointer-events: none; }
    #pads button { pointer-events: auto; font: inherit; color: #f4f7fb; cursor: pointer; }
    #skip { padding: 9px 14px; border-radius: 999px; font-size: 14px; }
    #fast { width: 74px; height: 74px; border-radius: 50%; font-size: 14px; font-weight: 600; -webkit-user-select: none; user-select: none; touch-action: none; }
    #arrive { position: fixed; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; padding: 14px 16px; }
    #arrive b { font-size: 18px; }
    #arrive p { margin: 4px 0 10px; font-size: 13px; color: #b9c4d3; }
    #arrive .row { display: grid; gap: 8px; }
    #arrive .btn { display: block; text-align: center; font: inherit; font-size: 15px; color: #f4f7fb; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 12px; padding: 10px; text-decoration: none; cursor: pointer; }
    #arrive .go { background: #2f7fe8; border-color: #2f7fe8; font-weight: 600; }
    [hidden] { display: none !important; }
    #skiHud { position: fixed; left: 12px; right: 12px; bottom: calc(18px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; padding: 10px 14px; }
    #skiHud .nums { display: flex; justify-content: space-between; font-size: 13px; color: #b9c4d3; }
    #skiHud .nums b { font-size: 22px; color: #fff; }
    #skiHud p { margin: 6px 0 0; font-size: 15px; }
    body.picking #credit { display: none; }
    #runTags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .rtag { position: absolute; left: 0; top: 0; pointer-events: auto; font: inherit; font-size: 13px; font-weight: 600; color: #f4f7fb; background: rgba(14,22,34,.78); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 4px 10px; white-space: nowrap; cursor: pointer; }
    .rtag.on { background: #2f7fe8; border-color: #fff; z-index: 2; }
    .rtag.leg { pointer-events: none; font-size: 12px; padding: 3px 8px; }
    .rtag.via { pointer-events: none; background: rgba(120,84,8,.9); border-color: #f2b632; }
    .rtag.pin { z-index: 2; font-size: 13px; background: rgba(255,255,255,.92); color: #142033; border-color: #f2b632; }
    .rtag small { font-weight: 500; opacity: .75; margin-left: 2px; }
    .rtag.dest { pointer-events: none; z-index: 3; font-size: 14px; background: #f2b632; color: #1d1606; border-color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
    #pickTabs { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
    #pickTabs button { font: inherit; font-size: 13px; font-weight: 600; color: #f4f7fb; background: rgba(14,22,34,.7); border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 6px 12px; cursor: pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    #pickTabs button.on { background: #fff; color: #142033; }
    .rcard .r1 .t { margin-left: auto; font-size: 13px; color: #f2b632; font-weight: 600; }
    .rcard .steps { font-size: 13px; line-height: 1.5; color: #e9f1ff; }
    .rcard .steps .lift { color: #f2b632; font-weight: 600; }
    .rcard .warn { color: #ffb4a8; }
    .rcard small.to { color: #f2d28a; }
    #pick { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); }
    #runCards { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 calc(50vw - min(39vw, 160px)); scrollbar-width: none; touch-action: pan-x; }
    #runCards::-webkit-scrollbar { display: none; }
    .rcard { flex: 0 0 min(78vw, 320px); scroll-snap-align: center; box-sizing: border-box; padding: 10px 12px; border-radius: 16px; background: rgba(14,22,34,.72); border: 1px solid rgba(255,255,255,.16); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); display: grid; gap: 4px; opacity: .8; transform: scale(.96); transition: transform .25s, opacity .25s; }
    .rcard.on { opacity: 1; transform: none; border-color: #2f7fe8; }
    .rcard .r1 { display: flex; align-items: center; gap: 6px; font-size: 16px; }
    .rcard small { color: #b9c4d3; font-size: 12px; }
    .rcard canvas { width: 100%; height: 40px; }
    .rcard .go { margin-top: 4px; font: inherit; font-size: 15px; font-weight: 600; color: #fff; background: #2f7fe8; border: 0; border-radius: 10px; padding: 9px; cursor: pointer; }
    .rcard:not(.on) .go { background: rgba(47,127,232,.45); }
    .pickLinks { display: flex; justify-content: center; gap: 18px; margin-top: 8px; font-size: 13px; }
    .pickLinks a { color: #e9f1ff; text-decoration: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
    .lv { display: inline-block; width: 11px; height: 11px; margin-right: 4px; }
    .lv.easy { background: #22b35a; border-radius: 50%; } .lv.intermediate { background: #1f6fe5; }
    .lv.advanced, .lv.expert { background: #111; transform: rotate(45deg) scale(.85); outline: 1px solid #fff; }
    .lv.expert { box-shadow: 7px -7px 0 #111; margin-right: 10px; }
    #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 12px 18px; }
    #credit { position: fixed; right: 6px; bottom: 2px; font-size: 9px; color: rgba(30, 40, 55, .6); pointer-events: none; }
  </style>
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="top" class="glass"><b>🚡 <span id="liftName"></span></b> <a id="back" href="mountain/">← 沙盘</a><p id="desc"></p><p id="weather"></p></div>
  <button id="bubble" class="glass">🫧 放下防风罩</button>
  <div id="pads"><button id="skip" class="glass" hidden>跳到山顶 ⏭</button><button id="fast" class="glass" hidden>按住<br>加速</button></div>
  <div id="runTags"></div>
  <div id="pick" hidden><div id="pickTabs"></div><div id="runCards"></div><div class="pickLinks"><a href="mountain/">← 回沙盘</a><a href="javascript:location.reload()">再坐一次</a></div></div>
  <div id="skiHud" class="glass" hidden><div class="nums"><span><b id="skiSpeed">0</b> km/h</span><span>还剩 <b id="skiLeft"></b></span></div><p id="skiCue"></p></div>
  <div id="arrive" class="glass" hidden><b id="arriveTitle"></b><p id="arriveNote"></p>
    <div class="row" id="arriveRow"><a class="btn go" id="skiDown">从这里滑下去（旧版画面）›</a><a class="btn" href="mountain/">回沙盘选下一条</a><button class="btn" id="again">再坐一次</button></div></div>
  <div id="status" class="glass">加载中…</div>
  <div id="credit">雪道和缆车 © OpenStreetMap 贡献者 · 地形 AWS Terrain Tiles · 雪地材质和云杉枝叶 Poly Haven (CC0)</div>
  <script type="module" src="look.js?v=21"></script>
</body>
</html>
