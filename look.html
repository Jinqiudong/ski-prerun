<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="雪场预滑">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f7fe8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>雪场预滑</title>
  <link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/ride.css?v=1">
  <!-- A plain cover from the first paint until the transition (src/core/transition.js) takes over. -->
  <style>html.trans-cover body::after { content: ""; position: fixed; inset: 0; z-index: 89; background: #dde3e9; }</style>
  <script>try { if (!navigator.webdriver && sessionStorage.getItem("prerunTicket")) { document.documentElement.classList.add("trans-cover"); setTimeout(() => document.documentElement.classList.remove("trans-cover"), 8000); } } catch { /* storage off */ }</script>
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/paper.css?v=1">
  <link rel="stylesheet" href="src/styles/ride-paper.css?v=2">
</head>
<body>
  <canvas id="c"></canvas>
  <div id="vignette"></div>
  <div id="top" class="glass"><b id="topBar"><img id="liftIco" src="assets/icons/lift.png?v=1" alt=""><span id="liftName"></span><small id="wxToggle">雪况 ⌄</small></b><div id="topInfo" hidden><div id="weather"></div><p id="desc"></p></div></div>
  <button id="menuBtn" class="rfab" aria-label="菜单"><img alt=""></button>
  <button id="tabFab" class="rfab" aria-label="页面"><img src="assets/icons/resorts.png?v=1" alt=""></button>
  <div id="fanDim" hidden></div><div id="fanDown" class="fan" hidden></div><div id="fanUp" class="fan" hidden></div>
  <button id="bubble" aria-label="防风罩"><img src="assets/icons/windy.png?v=1" alt=""><span>放下防风罩</span></button>
  <!-- The chair ride as a player: back, pause, fast; the line from the bottom station to the flag at the top,
       drag it to jump ahead; 路线 opens the roadbook, 速度 cycles how fast the chair goes. -->
  <!-- The chair ride as one bar: the chair is the speed (tap: ×1 ×2 ×4), drag the dot along the line, the
       flag at the top is pause. Tap the canopy itself to pull it down. -->
  <div id="rideBar" hidden>
    <div class="track"><button id="rbSpeed" aria-label="速度"><img src="assets/icons/lift.png?v=1" alt=""><b class="one">×1</b></button>
      <div class="tr"><i class="fill"></i><i class="knob"></i><span id="rbTime">0:00 / 0:00</span><input id="rbSeek" type="range" min="0" max="1000" value="0"></div>
      <button id="rbPause" aria-label="暂停"><img src="assets/icons/challenge.png?v=1" alt=""><svg viewBox="0 0 24 24" width="16" height="16"><path class="ps" d="M7 5h3.5v14H7z M13.5 5H17v14h-3.5z" fill="#fdfbf6"/><path class="pl" d="M8 5 L19 12 L8 19Z" fill="#fdfbf6"/></svg></button></div>
  </div>
  <button id="bubbleHint" hidden aria-label="防风罩"><img src="assets/icons/windy.png?v=1" alt=""><span hidden></span></button>
  <div id="pads"><button id="skip" class="glass" hidden>跳到山顶 ⏭</button><button id="fast" class="glass" hidden>按住<br>加速</button></div>
  <div id="runTags"></div>
  <div id="pick" hidden><div id="pickTabs"></div><div id="runCards"></div><div class="pickLinks"><a href="mountain/">← 回沙盘</a><a class="again" href="look.html">再坐一次</a></div></div>
  <div id="skiHud" class="glass" hidden><div class="nums"><span><b id="skiSpeed">0</b> km/h</span><span>还剩 <b id="skiLeft"></b></span></div><p id="skiWhere"></p><p id="skiCue"></p></div>
  <div id="turnCue" hidden></div>
  <div id="arrive" class="glass" hidden><b id="arriveTitle"></b><p id="arriveNote"></p>
    <div class="row" id="arriveRow"><a class="btn" href="mountain/">回沙盘选下一条</a><button class="btn" id="again">再坐一次</button></div></div>
  <button id="trickBtn" hidden>🤸<br>动作</button>
  <div id="trickWheel" hidden></div>
  <div id="liftOffer" class="glass" hidden></div>
  <div id="rePlan" class="glass sheet" hidden></div>
  <div id="guide" class="sheet scroll" hidden></div>
  <div id="menu" class="glass sheet" style="z-index:10" hidden></div>
  <div id="flash"></div>
  <div id="status" class="glass">加载中…</div>
  <div id="credit">雪道和缆车 © OpenStreetMap 贡献者 · 地形 AWS Terrain Tiles · 雪地材质和云杉枝叶 Poly Haven (CC0) · 原型，仅供熟悉路线，以雪场官方地图为准</div>
  <script type="module">import { liftRide } from "./src/core/transition.js?v=6"; liftRide();</script>
  <script type="module" src="src/ride/ride.js?v=22"></script>
</body>
</html>
