<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Copper Mountain · 半写实地形 样稿</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --glass: rgba(14, 22, 34, .62); --ink: #f4f7fb; --muted: #b9c4d3; --accent: #2f7fe8; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc4ee; font-family: "Noto Sans SC", -apple-system, "PingFang SC", sans-serif; color: var(--ink); touch-action: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .glass { background: var(--glass); border: 1px solid rgba(255, 255, 255, .16); border-radius: 14px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 8px 24px rgba(5, 12, 24, .25); }
    #title { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; padding: 8px 14px; }
    #title b { font-size: 17px; display: block; }
    #title span { font-size: 12px; color: var(--muted); }
    #bar { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #bar button { font: inherit; font-size: 14px; color: var(--ink); padding: 8px 12px; cursor: pointer; }
    #bar button.on { background: rgba(47, 127, 232, .9); }
    #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 12px 18px; font-size: 15px; }
    #pins { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .pin { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
    .pin b { background: #1d6b45; color: #fff; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; box-shadow: 0 4px 12px rgba(0, 0, 0, .3); white-space: nowrap; border: 1px solid rgba(255, 255, 255, .5); }
    .pin i { width: 2px; height: 18px; background: #fff; box-shadow: 0 0 4px rgba(0, 0, 0, .4); }
    .pin.on b { background: var(--accent); }
    .tag { position: absolute; transform: translate(-50%, -100%); background: rgba(196, 56, 46, .92); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; pointer-events: none; box-shadow: 0 3px 8px rgba(0, 0, 0, .3); }
    #base { position: fixed; left: 12px; right: 12px; bottom: calc(64px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; padding: 14px 16px; display: none; }
    #base.show { display: block; }
    #base h2 { margin: 0 0 2px; font-size: 19px; display: flex; justify-content: space-between; align-items: center; }
    #base h2 button { background: none; border: 0; color: var(--ink); font-size: 24px; cursor: pointer; }
    #base p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
    #base ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    #base li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .08); font-size: 15px; }
    #base li small { color: var(--muted); font-size: 12px; white-space: nowrap; }
    #credit { position: fixed; right: 8px; bottom: 2px; font-size: 9px; color: rgba(255, 255, 255, .75); text-shadow: 0 1px 2px rgba(0, 0, 0, .4); pointer-events: none; }
  </style>
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="title" class="glass"><b>Copper Mountain</b><span>半写实地形 · 第 1 步样稿 · 点绿色标签选出发的 base</span></div>
  <div id="pins"></div>
  <div id="status" class="glass">生成山体…</div>
  <div id="base" class="glass"><h2><span id="baseName"></span><button id="baseClose" aria-label="关闭">×</button></h2><p id="baseMeta"></p><ul id="baseLifts"></ul></div>
  <div id="bar">
    <button class="glass" data-view="hero">全景</button>
    <button class="glass" data-view="close">近看</button>
    <button class="glass" data-view="top">俯视</button>
    <button class="glass on" id="spin">自动旋转</button>
    <button class="glass on" id="runs">雪道</button>
    <button class="glass on" id="lifts">缆车</button>
  </div>
  <div id="credit">雪道和缆车 © OpenStreetMap 贡献者 · 地形 AWS Terrain Tiles · 雪地材质 Poly Haven (CC0)</div>
  <script type="module" src="mountain.js?v=3"></script>
</body>
</html>
