<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Copper Mountain · 半写实地形 样稿</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --glass: rgba(14, 22, 34, .62); --ink: #f4f7fb; --muted: #b9c4d3; --accent: #2f7fe8; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc4ee; font-family: "Noto Sans SC", -apple-system, "PingFang SC", sans-serif; color: var(--ink); touch-action: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .glass { background: var(--glass); border: 1px solid rgba(255, 255, 255, .16); border-radius: 14px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 8px 24px rgba(5, 12, 24, .25); }
    #title { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; padding: 8px 14px; }
    #title b { font-size: 17px; display: block; }
    #title span { font-size: 12px; color: var(--muted); }
    #bar { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #bar button { font: inherit; font-size: 14px; color: var(--ink); padding: 8px 12px; cursor: pointer; }
    #bar button.on { background: rgba(47, 127, 232, .9); }
    #status { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 12px 18px; font-size: 15px; }
    #pins { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .pin { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
    .pin b { background: #1d6b45; color: #fff; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; box-shadow: 0 4px 12px rgba(0, 0, 0, .3); white-space: nowrap; border: 1px solid rgba(255, 255, 255, .5); }
    .pin i { width: 2px; height: 18px; background: #fff; box-shadow: 0 0 4px rgba(0, 0, 0, .4); }
    .pin.on b { background: var(--accent); }
    .tag { position: absolute; transform: translate(-50%, -100%); background: rgba(196, 56, 46, .92); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; pointer-events: none; box-shadow: 0 3px 8px rgba(0, 0, 0, .3); }
    #base { position: fixed; left: 12px; right: 12px; bottom: calc(64px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; padding: 14px 16px; display: none; }
    #base.show { display: block; }
    #base h2 { margin: 0 0 2px; font-size: 19px; display: flex; justify-content: space-between; align-items: center; }
    #base h2 button { background: none; border: 0; color: var(--ink); font-size: 24px; cursor: pointer; }
    #base p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
    #base ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    #base li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .08); font-size: 15px; }
    #base li small { color: var(--muted); font-size: 12px; white-space: nowrap; }
    #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(8,18,40,.38) 100%); }
    #now { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; padding: 8px 12px; font-size: 13px; cursor: pointer; text-align: right; max-width: 46vw; }
    #timePanel { position: fixed; top: calc(60px + env(safe-area-inset-top)); right: 12px; padding: 12px; display: none; width: 250px; }
    #timePanel.show { display: block; }
    #timePanel label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
    #timePanel input { width: 100%; }
    #timePanel .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    #timePanel button { font: inherit; font-size: 13px; color: var(--ink); background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
    #timePanel #live { background: var(--accent); border-color: var(--accent); }
    body.mini #pins, body.mini #bar, body.mini #now, body.mini #timePanel, body.mini #title, body.mini #vignette, body.mini #base { display: none !important; }
    #miniTop { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; display: none; justify-content: space-between; align-items: center; gap: 8px; }
    body.mini #miniTop { display: flex; }
    #miniTop .glass { padding: 8px 14px; font-weight: 600; }
    #miniTop button { font: inherit; color: var(--ink); cursor: pointer; }
    #introSkip { position: fixed; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom)); padding: 8px 16px; font: inherit; color: var(--ink); cursor: pointer; display: none; }
    body.mini #introSkip:not([hidden]) { display: block; }
    /* Picking a lift: tags in the world, plan chips on top, cards along the bottom, a detail sheet. */
    #liftTags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; display: none; }
    body.picking #liftTags { display: block; }
    body.detail #liftTags { opacity: 0; }
    .ltag { position: absolute; left: 0; top: 0; pointer-events: auto; font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: opacity .2s; }
    .ltag b, .ltag small { background: rgba(14, 22, 34, .78); white-space: nowrap; }
    .ltag b { font-size: 13px; font-weight: 600; padding: 4px 10px 2px; border-radius: 10px 10px 0 0; border: 1px solid rgba(255,255,255,.25); border-bottom: 0; transition: background .2s, transform .2s; }
    .ltag small { font-size: 11px; color: var(--muted); padding: 0 10px 4px; border-radius: 0 0 10px 10px; border: 1px solid rgba(255,255,255,.25); border-top: 0; }
    .ltag i { width: 2px; height: 14px; background: rgba(255,255,255,.85); }
    .ltag.small b { font-size: 11px; } .ltag.small small { display: none; } .ltag.small b { border-radius: 10px; border-bottom: 1px solid rgba(255,255,255,.25); padding-bottom: 4px; }
    .ltag.on { z-index: 2; }
    .ltag.on b, .ltag.on small { background: var(--accent); color: #fff; border-color: rgba(255,255,255,.7); }
    body.picking .ltag:not(.on) { opacity: .82; }
    #plansBar { position: fixed; top: calc(60px + env(safe-area-inset-top)); left: 12px; right: 12px; display: none; flex-direction: column; align-items: flex-start; gap: 6px; }
    body.picking #plansBar { display: flex; }
    body.detail #plansBar { opacity: 0; pointer-events: none; }
    .plans { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .plans span { font-size: 13px; color: #1d2633; text-shadow: 0 1px 2px rgba(255,255,255,.7); }
    .plans button { font: inherit; font-size: 13px; color: var(--ink); padding: 5px 11px; border-radius: 999px; cursor: pointer; }
    .plans button.on { background: var(--accent); border-color: var(--accent); }
    #planOut { font-size: 12px; padding: 6px 10px; max-width: 520px; color: var(--muted); }
    #planOut b { color: var(--ink); }
    #legend { font-size: 11px; color: var(--muted); padding: 4px 10px; display: flex; align-items: center; gap: 4px; }
    #legend .sw { width: 16px; height: 4px; border-radius: 2px; background: #1f6fe5; margin-left: 4px; }
    #legend .sw:first-child { margin-left: 0; }
    #legend .half { opacity: .5; }
    #liftCards { position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom)); display: none; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 calc(50vw - min(39vw, 160px)); scrollbar-width: none; touch-action: pan-x; transition: transform .3s, opacity .3s; }
    #liftCards::-webkit-scrollbar { display: none; }
    body.picking #liftCards { display: flex; }
    body.detail #liftCards { transform: translateY(30px); opacity: 0; pointer-events: none; }
    .liftCard { flex: 0 0 min(78vw, 320px); scroll-snap-align: center; box-sizing: border-box; padding: 10px 12px; border-radius: 16px; background: var(--glass); border: 1px solid rgba(255,255,255,.16); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); display: grid; gap: 4px; cursor: pointer; opacity: .78; transform: scale(.96); transition: transform .25s, opacity .25s, border-color .25s; }
    .liftCard.on { opacity: 1; transform: none; border-color: var(--accent); }
    .liftCard .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .liftCard b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .liftCard small { color: var(--muted); font-size: 12px; }
    .lvls { display: flex; gap: 6px; font-size: 12px; white-space: nowrap; }
    .cnt { display: inline-flex; align-items: center; }
    .acts { display: flex; gap: 8px; margin-top: 4px; }
    .acts button { font: inherit; font-size: 14px; border-radius: 10px; padding: 8px 10px; cursor: pointer; }
    .acts .more { color: var(--ink); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); flex: 0 0 auto; }
    .acts .go { flex: 1; color: #fff; background: var(--accent); border: 0; font-weight: 600; }
    .liftCard:not(.on) .acts .go { background: rgba(47,127,232,.45); }
    body.detail #credit { opacity: 0; }
    body.picking #credit { bottom: calc(150px + env(safe-area-inset-bottom)); }
    #dim { position: fixed; inset: 0; background: rgba(6, 12, 22, .38); opacity: 0; pointer-events: none; transition: opacity .3s; }
    body.detail #dim { opacity: 1; pointer-events: auto; }
    #detail { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; padding: 6px 16px 14px; border-radius: 18px; transform: translateY(110%); transition: transform .35s cubic-bezier(.2,.8,.2,1); display: none; }
    body.picking #detail { display: block; }
    body.detail #detail { transform: none; }
    #detailClose { width: 100%; background: none; border: 0; padding: 6px 0 4px; cursor: pointer; display: grid; justify-items: center; }
    #detailClose i { width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.45); }
    #detailBody { max-height: 44vh; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
    #detailBody h2 { margin: 2px 0; font-size: 19px; }
    #detailBody h3 { margin: 12px 0 4px; font-size: 13px; color: var(--muted); font-weight: 400; }
    #detailBody .meta, #detailBody .hint { margin: 0; color: var(--muted); font-size: 13px; }
    #detailBody .hint { margin-top: 12px; font-size: 12px; }
    #detailBody .runs { margin: 0 0 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; }
    #detailBody .nx { margin: 0 0 6px; font-size: 14px; display: grid; }
    #detailBody .nx small { color: var(--muted); font-size: 12px; }
    #detailGo { width: 100%; margin-top: 10px; font: inherit; font-weight: 600; font-size: 16px; color: #fff; background: var(--accent); border: 0; border-radius: 12px; padding: 11px; cursor: pointer; }
    .lv { display: inline-block; width: 9px; height: 9px; margin-right: 3px; vertical-align: 0; }
    .lv.easy { background: #22b35a; border-radius: 50%; } .lv.intermediate { background: #1f6fe5; }
    .lv.advanced { background: #111; transform: rotate(45deg) scale(.8); outline: 1px solid #fff; } .lv.expert { background: #111; transform: rotate(45deg) scale(.8); outline: 1px solid #fff; box-shadow: 6px -6px 0 #111; margin-right: 8px; }
    #credit { position: fixed; right: 8px; bottom: 2px; font-size: 9px; color: rgba(255, 255, 255, .75); text-shadow: 0 1px 2px rgba(0, 0, 0, .4); pointer-events: none; }
  </style>
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="title" class="glass"><b>Copper Mountain</b><span>第 1 步样稿 · 点绿色标签选 base · 点右上角切时间和天气</span></div>
  <div id="vignette"></div>
  <div id="miniTop"><div class="glass">🏠 <span id="miniTitle"></span></div><div style="display:flex;gap:8px"><button id="replay" class="glass">↻ 转一圈</button><button id="miniBack" class="glass">← 回全景</button></div></div>
  <button id="introSkip" class="glass" hidden>跳过 ⏭</button>
  <div id="liftTags"></div>
  <div id="plansBar"><div class="plans"><span>今天想怎么滑</span><button class="glass" data-plan="easy">热身（绿）</button><button class="glass" data-plan="intermediate">巡航（蓝）</button><button class="glass" data-plan="advanced">挑战（黑）</button></div><div id="planOut" class="glass" hidden></div><div id="legend" class="glass"><span class="sw full"></span>山顶直接出发 <span class="sw half"></span>滑下去能接上</div></div>
  <div id="liftCards"></div>
  <div id="dim"></div>
  <div id="detail" class="glass"><button id="detailClose" aria-label="收起"><i></i></button><div id="detailBody"></div><button id="detailGo">坐缆车上山 ›</button></div>
  <div id="pins"></div>
  <div id="now" class="glass">…</div>
  <div id="timePanel" class="glass">
    <label for="hour">拖动看一天中不同时间（Copper 当地时间）</label>
    <input id="hour" type="range" min="0" max="23" step="1">
    <div class="row"><button data-weather="clear">晴</button><button data-weather="cloudy">多云</button><button data-weather="overcast">阴</button><button data-weather="snow">下雪</button><button id="live">回到实时</button></div>
  </div>
  <div id="status" class="glass">生成山体…</div>
  <div id="base" class="glass"><h2><span id="baseName"></span><button id="baseClose" aria-label="关闭">×</button></h2><p id="baseMeta"></p><ul id="baseLifts"></ul></div>
  <div id="bar">
    <button class="glass" data-view="hero">全景</button>
    <button class="glass" data-view="close">近看</button>
    <button class="glass" data-view="top">俯视</button>
    <button class="glass on" id="spin">自动旋转</button>
    <button class="glass on" id="runs">雪道</button>
    <button class="glass on" id="lifts">缆车</button>
  </div>
  <div id="credit">雪道和缆车 © OpenStreetMap 贡献者 · 地形 AWS Terrain Tiles · 雪地材质 Poly Haven (CC0)</div>
  <script type="module" src="mountain.js?v=19"></script>
</body>
</html>
