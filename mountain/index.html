<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="../src/core/frame.js?v=1" data-page></script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="雪场预滑">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f6f2ea">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>雪场预滑</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
  <script>
    // The app starts by picking a rider; anyone arriving here without one goes there first.
    try { if (!JSON.parse(localStorage.getItem("prerun") || "{}").rider) location.replace("../start.html"); } catch { /* storage off: carry on */ }
  </script>
  <!-- A plain cover from the first paint until the transition (src/core/transition.js) takes over. -->
  <style>html.trans-cover body::after { content: ""; position: fixed; inset: 0; z-index: 89; background: #dde3e9; }</style>
  <script>try { if (!navigator.webdriver && sessionStorage.getItem("prerunFly")) { document.documentElement.classList.add("trans-cover"); setTimeout(() => document.documentElement.classList.remove("trans-cover"), 8000); } } catch { /* storage off */ }</script>
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/styles/paper.css?v=2">
  <link rel="stylesheet" href="../src/styles/resort.css?v=2">
</head>
<body>
  <canvas id="c"></canvas>
  <!-- The top: back, the resort's region and name, your avatar (the menu); the weather chip under it. -->
  <div id="title"><button id="backBtn" class="rb" aria-label="返回"><img src="../assets/icons/back.png?v=1" alt=""></button>
    <div class="tt"><i>COLORADO</i><b>Copper Mountain</b><small id="heights"></small></div>
    <button id="navBtn" class="rb av" aria-label="菜单"><img alt=""></button></div>
  <!-- The flags at the bases and, for the chosen base, a pin at each lift's top (src/mountain/mountain.js). -->
  <div id="tops"></div>
  <div id="flags"></div>
  <button id="now"><img id="nowIcon" src="../assets/icons/cloudy.png?v=1" alt=""><span id="nowTime"></span></button>
  <!-- The sky to preview: the hour slides, the weather is a tap; 实时 brings back now and the real weather. -->
  <div id="timePanel">
    <div class="th"><b id="tpTime">--:--</b><button id="tpLive"><img src="../assets/icons/refresh.png?v=1" alt="">实时</button></div>
    <input id="hour" type="range" min="0" max="23.75" step="0.25" value="12">
    <div class="tl"><small>00:00</small><small id="tpRise" class="mk">日出</small><small id="tpNoon" class="mk">12:00</small><small id="tpSet" class="mk">日落</small><small>23:00</small></div>
    <div class="wxrow"><button data-wx="clear"><img src="../assets/icons/sunny.png?v=1" alt=""><span>晴</span></button><button data-wx="cloudy"><img src="../assets/icons/partly.png?v=1" alt=""><span>多云</span></button><button data-wx="overcast"><img src="../assets/icons/cloudy.png?v=1" alt=""><span>阴</span></button><button data-wx="snow"><img src="../assets/icons/snow_now.png?v=1" alt=""><span>雪</span></button></div>
  </div>
  <div id="status">生成山体…</div>
  <p id="hint">点一个村子出发</p>
  <!-- The chosen base: a row per lift, tap one to ride it. -->
  <div id="sheet"><div id="eyebrow" translate="no"></div><p id="tip" hidden></p><div id="rows"></div></div>
  <div id="credit">雪道和缆车 © OpenStreetMap 贡献者 · 地形 AWS Terrain Tiles · 原型，仅供熟悉路线，以雪场官方地图为准</div>
  <script type="module">import { flyIn } from "../src/core/transition.js?v=21"; flyIn();</script>
  <script type="module" src="../src/mountain/mountain.js?v=37"></script>
</body>
</html>
