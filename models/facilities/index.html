<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Facilities · Ski Pre-Run</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f1e7; font-family: "Noto Serif SC", Georgia, serif; color: #33302c; }
    canvas { display: block; touch-action: none; }
    #bar { position: fixed; left: 10px; right: 10px; top: max(10px, env(safe-area-inset-top)); display: flex; flex-wrap: wrap; gap: 6px; }
    #bar button { font: 600 14px Georgia, "Noto Serif SC", serif; color: #22344d; background: #fdfbf6; border: 1px solid #cbbfa9; border-radius: 999px; padding: 6px 12px; }
    #bar button.on { background: #22344d; color: #fdfbf6; }
    #cap { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); background: rgba(253,251,246,.94); border-radius: 6px; padding: 10px 12px; font-size: 14px; box-shadow: 0 6px 16px rgba(40,30,20,.18); }
  </style>
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <div id="bar"></div>
  <div id="cap"></div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
