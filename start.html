<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script src="src/core/frame.js?v=1" data-page></script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="雪场预滑">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f7fe8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>雪场预滑</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/start.css?v=11">
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs><filter id="wct" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="1.2" result="d"/><feGaussianBlur in="d" stdDeviation=".25"/></filter></defs></svg>
  <!-- The rider in the snow, the whole screen: turn her round, tap a part of her to change it, strike a pose,
       watch an entrance. 换装 (or a tap on her) opens the wardrobe round her. -->
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="head"><div><b id="headTitle">选你的穿搭</b><small id="headSub">先选一套穿搭，再选雪场</small><button id="resumeBtn" class="pill" hidden></button></div>
      <div class="side"><button id="setBtn" aria-label="设置"><img alt=""><i><img src="assets/icons/sliders.png?v=1" alt=""></i></button><button id="dressBtn" class="pill"><img src="assets/icons/hanger.png?v=1" alt="">换装</button></div></div>
    <div id="status">穿搭加载中…</div>
    <div id="dock">
      <div id="posePane"><small class="lbl">摆姿势</small><div id="poses"></div></div>
      <div id="entryPane" hidden><small class="lbl"><span>出场 · 点一下从头看，再点一下设成最爱 ★</span><button id="entryClose">‹ 收起</button></small><div id="entries"></div></div>
      <button id="goBtn" aria-label="出场"><i><img src="assets/icons/ride_crayon_0.png?v=2" alt=""></i><span>出场</span></button>
    </div>
    <!-- The wardrobe: a rail of icons (outfits, jacket, pants, gear, then the look), and what the chosen one
         changes on a sheet below. Every change is live on the rider and is what you ride in. -->
    <div id="dressTop"><button id="dressBack" class="pill">‹ 人物</button><button id="dressDone">完成</button></div>
    <nav id="rail"></nav>
    <div id="sheet"><i class="grab"></i><div id="wsub"></div><div id="wbody"></div></div>
  </div>
  <div id="world" hidden><canvas></canvas><div id="ctags"></div>
    <div id="worldHead"><b>去哪座山？</b><small></small></div><button id="worldHome">全图</button>
    <div id="worldCard" hidden></div><button id="allBtn">‹ 全部雪场</button><svg id="compass" viewBox="0 0 60 60" aria-hidden="true"><g fill="none" stroke="#6b5a4a" stroke-width="1"><circle cx="30" cy="32" r="16"/><circle cx="30" cy="32" r="12" stroke-dasharray="1.5 2"/></g><path d="M30 12 L33 32 L30 52 L27 32Z" fill="#8a7563"/><path d="M30 12 L33 32 L27 32Z" fill="#b6463b"/><path d="M10 32 L30 29 L50 32 L30 35Z" fill="#a8998a"/><text x="30" y="9" font-size="8" text-anchor="middle" fill="#6b5a4a" font-family="Cormorant Garamond">N</text></svg><div id="worldCredit">地形 AWS Terrain Tiles · 雪道 © OpenStreetMap 贡献者 · 原型，以雪场官方地图为准</div></div>
  <div id="records" hidden><div id="memory"></div></div>
  <div id="trips" hidden></div>
  <nav id="tabs"><button data-tab="rider"><img src="assets/icons/rider.png?v=1" alt="">人物</button><button data-tab="resort"><img src="assets/icons/resorts.png?v=1" alt="">雪场</button><button data-tab="trip"><img src="assets/icons/trips.png?v=1" alt="">行程</button><button data-tab="log"><img src="assets/icons/memory.png?v=1" alt="">记录</button></nav>
  <script type="module" src="src/start/start.js?v=48"></script>
</body>
</html>
