<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="雪场预滑">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f7fe8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>雪场预滑</title>
  <link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Caveat:wght@500;700&family=Oswald:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    :root { --glass: rgba(14, 22, 34, .66); --ink: #f4f7fb; --muted: #b9c4d3; --accent: #2f7fe8; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#bcd3ee, #eef2f7 60%); font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; color: var(--ink); }
    #c { position: fixed; left: 0; right: 0; top: 0; height: 58vh; width: 100%; display: block; touch-action: none; }
    .glass { background: var(--glass); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    #head { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    #head b { font-size: 17px; } #head small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    #who { position: fixed; top: calc(46.5vh); left: 0; right: 0; text-align: center; color: #142033; font-size: 22px; font-weight: 700; text-shadow: 0 1px 3px rgba(255,255,255,.8); pointer-events: none; }
    #sheet { position: fixed; left: 0; right: 0; bottom: 0; top: 52vh; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); overflow-y: auto; border-radius: 20px 20px 0 0; }
    h3 { margin: 6px 4px 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
    .row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .row::-webkit-scrollbar { display: none; }
    .card { flex: 0 0 96px; height: 92px; box-sizing: border-box; border-radius: 14px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.14); color: var(--ink); font: inherit; padding: 8px; cursor: pointer; position: relative; display: flex; flex-direction: column; justify-content: space-between; text-align: left; }
    .card.on { border-color: var(--accent); background: rgba(47,127,232,.25); }
    .card[disabled] { opacity: .45; cursor: default; }
    .card b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card small { font-size: 11px; color: var(--muted); }
    .card .dots { display: flex; gap: 3px; }
    .card .dots i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); }
    .card .del { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.35); color: #fff; font-size: 13px; cursor: pointer; }
    .btns { display: flex; gap: 8px; margin-top: 14px; }
    .btns button { flex: 1; font: inherit; font-size: 15px; white-space: nowrap; font-weight: 600; border-radius: 12px; padding: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,.22); color: var(--ink); background: rgba(255,255,255,.1); }
    .btns .go { background: var(--accent); border-color: var(--accent); color: #fff; }
    .seg { display: flex; gap: 6px; }
    .seg button { flex: 1; font: inherit; font-size: 14px; color: var(--ink); background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.14); border-radius: 12px; padding: 9px 6px; cursor: pointer; }
    .seg button.on { border-color: var(--accent); background: rgba(47,127,232,.25); font-weight: 600; }
    .part { margin: 4px 0 10px; }
    .part .lbl { font-size: 14px; margin: 0 4px 6px; display: flex; justify-content: space-between; }
    .sw { flex: 0 0 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); cursor: pointer; padding: 0; }
    .sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
    .sw.pick { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); position: relative; overflow: hidden; }
    .sw.pick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    #name { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: var(--ink); }
    .resort { display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; margin-bottom: 8px; font: inherit; color: var(--ink); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 14px; padding: 12px 14px; cursor: pointer; text-align: left; }
    .resort b { font-size: 16px; display: block; } .resort small { color: var(--muted); font-size: 12px; }
    .resort[disabled] { opacity: .45; cursor: default; }
    /* Tabs along the bottom: rider, resorts (the conquest map), journal. */
    #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); background: rgba(14,22,34,.88); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,.12); }
    #tabs button { flex: 1; font: inherit; font-size: 12px; color: #9aa6b6; background: none; border: 0; padding: 4px; cursor: pointer; display: grid; justify-items: center; gap: 2px; }
    #tabs button span { font-size: 22px; } #tabs button.on { color: #fff; font-weight: 700; }
    #sheet { bottom: 62px !important; }
    #world, #records { position: fixed; inset: 0; bottom: 62px; z-index: 5; }
    #world { background: #eee9df; } #world canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #ctags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .ctag { position: absolute; left: 0; top: 0; pointer-events: auto; font: inherit; display: flex; gap: 4px; align-items: baseline; background: rgba(255,250,240,.94); color: #3b2a1a; border: 1.5px solid #8a5a35; border-radius: 999px; padding: 2px 8px; white-space: nowrap; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,.18); }
    .ctag b { font-size: 12px; } .ctag small { font-size: 10px; color: #7a5a3a; }
    .ctag.on { background: #7a4b25; color: #fff8ea; } .ctag.on small { color: #f3dcbb; }
    .ctag.town { pointer-events: none; background: none; border: 0; box-shadow: none; padding: 0; color: #4b4037; font-size: 10px; font-style: italic; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
    .ctag.town.s3 { font-size: 13px; font-weight: 700; font-style: normal; color: #a0432f; }
    #worldHead { padding-right: 64px; }
    #worldCredit { position: absolute; left: 8px; right: 8px; bottom: 2px; text-align: center; font-size: 9px; color: rgba(60,45,30,.6); pointer-events: none; }
    #worldHome { position: absolute; right: 12px; top: 12px; font: inherit; font-size: 12px; color: #3b2a1a; background: #fffaf0; border: 1.5px solid #8a5a35; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
    .ctag.city { pointer-events: none; background: none; border: 0; box-shadow: none; color: #a0432f; font-weight: 700; font-size: 12px; }
    #worldHead, #recHead { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; padding: 10px 14px; border-radius: 14px; background: rgba(255,248,234,.95); color: #3b2a1a; box-shadow: 0 0 0 2px #8a5a35; }
    #worldHead b, #recHead b { font-size: 17px; } #worldHead small, #recHead small { display: block; color: #7a5a3a; font-size: 12px; margin-top: 2px; }
    #worldCard { position: absolute; left: 12px; right: 12px; bottom: 18px; max-width: 520px; margin: 0 auto; padding: 12px 14px; border-radius: 16px; background: rgba(255,248,234,.97); color: #3b2a1a; box-shadow: 0 0 0 2px #8a5a35, 0 6px 16px rgba(0,0,0,.25); display: grid; gap: 6px; }
    #worldCard b { font-size: 18px; } #worldCard small { color: #7a5a3a; }
    #worldCard .bar { height: 8px; border-radius: 4px; background: #e2d7c3; overflow: hidden; } #worldCard .bar i { display: block; height: 100%; background: linear-gradient(90deg, #6fae7a, #f2b632); }
    #worldCard button, #records button.go { font: inherit; font-size: 16px; font-weight: 700; color: #fff8ea; background: #7a4b25; border: 0; border-radius: 12px; padding: 11px; cursor: pointer; }
    #records { background: #f4efe5; color: #3b2a1a; overflow-y: auto; }
    #recList { padding: 96px 12px 20px; display: grid; gap: 10px; }
    .rec { display: grid; gap: 6px; padding: 12px 14px; border-radius: 14px; background: #fffaf0; box-shadow: 0 0 0 2px #d9c7a8; }
    .rec .row1 { display: flex; justify-content: space-between; align-items: baseline; } .rec b { font-size: 16px; } .rec small { color: #7a5a3a; font-size: 12px; }
    .rec .bar { height: 8px; border-radius: 4px; background: #e2d7c3; overflow: hidden; } .rec .bar i { display: block; height: 100%; background: linear-gradient(90deg, #6fae7a, #f2b632); }
    .rec .recBtns { display: flex; gap: 8px; flex-wrap: wrap; } .rec .recBtns:empty { display: none; }
    .rec button { font: inherit; font-size: 14px; color: #3b2a1a; background: #fff; border: 2px solid #8a5a35; border-radius: 999px; padding: 6px 12px; cursor: pointer; justify-self: start; }
    #jMap { position: fixed; inset: 0; bottom: 62px; z-index: 15; background: #e9edf2; } #jMap canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #jMap .bar { position: absolute; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top)); display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 14px; background: rgba(255,248,234,.95); color: #3b2a1a; box-shadow: 0 0 0 2px #8a5a35; font-size: 14px; }
    #jMap .bar b { flex: 1; } #jMap .bar button { font: inherit; color: #3b2a1a; background: #fff; border: 2px solid #8a5a35; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
    /* Trips: a journal page, each trip and each day a lift ticket. */
    #trips { position: fixed; inset: 0; bottom: 62px; z-index: 5; overflow-y: auto; -webkit-overflow-scrolling: touch; color: #4a3626; padding: calc(40px + env(safe-area-inset-top)) 18px 30px;
      background-color: #f4ecd9; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .33  0 0 0 0 .2  0 0 0 .12 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); font-family: "Noto Serif SC", serif; }
    #trips .jhead { margin-bottom: 14px; padding-right: 84px; } #trips .jt { font-family: "Long Cang", cursive; font-size: 38px; line-height: 1.05; } #trips .js { font-family: "Long Cang"; font-size: 19px; color: #7a5a3a; }
    #trips .jsec { font-family: "Long Cang"; font-size: 22px; margin: 18px 0 8px; } #trips .jnote { font-family: "Long Cang"; font-size: 18px; color: #7a5a3a; margin: 10px 2px; } #trips .jnote.warn { color: #b5482f; }
    #trips .newtrip { width: 100%; font: inherit; text-align: left; font-family: "Long Cang"; font-size: 26px; color: #4a3626; background: transparent; border: 1.8px dashed #8a6a4a; border-radius: 12px; padding: 12px 16px; cursor: pointer; }
    #trips .newtrip small { display: block; font-size: 16px; color: #7a5a3a; }
    #trips .tk-wrap { position: relative; margin: 0 0 14px; }
    .tk { display: flex; background: #fffaf0; border-radius: 6px; box-shadow: 2px 4px 8px rgba(60,40,20,.28); overflow: hidden; min-height: 96px; cursor: pointer; }
    .tk-band { background: #c8452f; color: #fff5e1; writing-mode: vertical-rl; text-align: center; font-family: Oswald; letter-spacing: .25em; font-size: 12px; padding: 8px 4px; }
    .tk.epic .tk-band { background: #2b3a55; } .tk.day .tk-band { background: #6a8a5a; } .tk.none .tk-band { background: #8a7a66; }
    .tk-body { flex: 1; padding: 8px 12px; border-right: 2px dashed #d9c9a8; position: relative; }
    .tk-top { font-family: Oswald; font-size: 10px; letter-spacing: .25em; color: #9a7a5a; } .tk-title { font-family: Oswald; font-size: 22px; line-height: 1.1; color: #2a1d12; } .tk-sub { font-size: 12px; color: #6a5040; margin-top: 3px; line-height: 1.5; }
    .tk-count { display: inline-block; margin-top: 6px; padding: 0 10px; border: 1.5px solid #b5482f; color: #b5482f; border-radius: 999px; font-family: Caveat; font-size: 17px; transform: rotate(-3deg); }
    .tk-stub { width: 52px; background: repeating-linear-gradient(0deg, #3a2a1a 0 2px, #fffaf0 2px 4px, #3a2a1a 4px 5px, #fffaf0 5px 8px); background-clip: content-box; padding: 12px; }
    .tk-hole { position: absolute; top: 10px; width: 14px; height: 14px; border-radius: 50%; background: #f4ecd9; box-shadow: inset 1px 1px 2px rgba(0,0,0,.35); }
    .clip { position: absolute; right: 64px; top: -14px; width: 22px; height: 54px; border: 3px solid #8d96a3; border-radius: 11px; transform: rotate(8deg); }
    .clip::after { content: ""; position: absolute; left: 3px; top: 8px; width: 10px; height: 34px; border: 3px solid #8d96a3; border-radius: 6px; }
    #trips .ride { position: absolute; right: 64px; bottom: 10px; font-family: "Long Cang"; font-size: 18px; color: #fff5e1; background: #7a4b25; border: 0; border-radius: 999px; padding: 2px 12px; cursor: pointer; }
    #trips .back { font-family: "Long Cang"; font-size: 20px; color: #7a5a3a; background: none; border: 0; padding: 0; margin-bottom: 4px; cursor: pointer; }
    #trips .stamp { position: absolute; right: 20px; top: calc(48px + env(safe-area-inset-top)); width: 78px; height: 78px; border-radius: 50%; border: 3px double #b5482f; color: #b5482f; display: grid; place-items: center; text-align: center; font-family: "Special Elite"; font-size: 13px; transform: rotate(12deg); opacity: .85; }
    #trips .slips { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
    #trips .slip { background: #fbf4e2; border: 1.5px solid #5a4636; border-radius: 4px; padding: 8px 10px; font-family: "Long Cang"; font-size: 17px; box-shadow: 2px 3px 0 rgba(74,54,38,.2); }
    #trips .slip b { display: block; font-size: 20px; font-weight: 400; } #trips .slip span { margin-right: 8px; }
    #trips .slip:first-child { transform: rotate(-1.5deg); } #trips .slip:last-child { transform: rotate(1.5deg); }
    #trips .acts { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    #trips .acts button { font-family: "Long Cang"; font-size: 20px; color: #4a3626; background: #fffaf0; border: 1.8px solid #5a4636; border-radius: 999px; padding: 6px 16px; cursor: pointer; }
    #trips .acts .go { background: #7a4b25; color: #fff5e1; border-color: #7a4b25; flex: 1; }
    #trips .form label { display: block; font-family: "Long Cang"; font-size: 20px; margin: 12px 0 4px; }
    #trips .form input, #trips .form select { width: 100%; font: inherit; font-size: 16px; color: #3b2a1a; background: #fffaf0; border: 1.5px solid #5a4636; border-radius: 8px; padding: 8px 10px; }
    #trips .row2 { display: flex; gap: 8px; align-items: center; } #trips .row2 input { flex: 1; }
    #trips .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    #trips .chip { font: inherit; font-size: 13px; color: #4a3626; background: #fffaf0; border: 1.5px solid #8a6a4a; border-radius: 999px; padding: 5px 11px; cursor: pointer; }
    #trips .chip.on { background: #c8452f; border-color: #c8452f; color: #fff5e1; }
    #trips .dayrow { display: flex; gap: 8px; align-items: center; margin: 6px 0; font-family: "Long Cang"; font-size: 17px; } #trips .dayrow span { width: 150px; flex: none; white-space: nowrap; } #trips .dayrow select { flex: 1; }
    [hidden] { display: none !important; }
    #status { position: fixed; top: 26vh; left: 50%; transform: translateX(-50%); color: #142033; font-size: 14px; }
  </style>
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="head" class="glass"><div><b id="headTitle">选你的 Rider</b><small id="headSub">先选人物，再选雪场</small></div></div>
  <div id="status">人物加载中…</div>
  <div id="who"></div>
  <div id="sheet" class="glass">
    <section id="pickView">
      <h3>默认人物</h3><div class="row" id="defaults"></div>
      <h3>我的人物</h3><div class="row" id="mine"></div>
      <h3>哪只脚在前</h3><div class="seg" id="stance"><button data-s="regular">左脚在前 · Regular</button><button data-s="goofy">右脚在前 · Goofy</button></div>
      <div class="btns"><button id="editBtn">🎨 换装</button><button class="go" id="useBtn">用这个人物 ›</button></div>
    </section>
    <section id="editView" hidden>
      <div id="parts"></div>
      <h3>给人物取个名字</h3><input id="name" maxlength="16" placeholder="比如：周末的我">
      <div class="btns"><button id="cancelBtn">取消</button><button class="go" id="saveBtn">保存</button></div>
    </section>
  </div>
  <div id="world" hidden><canvas></canvas><div id="ctags"></div>
    <div id="worldHead"><b>🏔 去征服哪座山？</b><small>灰色的雪道还没滑过，滑过的变成彩色，全滑遍会开花 · 拖动移动，两指转动、倾斜、缩放</small><button id="worldHome">全图</button></div>
    <div id="worldCard" hidden></div><div id="worldCredit">地形 AWS Terrain Tiles · 道路、河流和雪道 © OpenStreetMap 贡献者 · 原型，以雪场官方地图为准</div></div>
  <div id="records" hidden><div id="recHead"><b>📖 我的滑雪记录</b><small>每个雪场你滑过多少（存在这台手机上）</small></div><div id="recList"></div></div>
  <div id="jMap" hidden><canvas></canvas><div class="bar"><b></b><button id="jZoom">+</button><button id="jZoomOut">−</button><button id="jClose">×</button></div></div>
  <div id="trips" hidden></div>
  <nav id="tabs"><button data-tab="rider"><span>🧑</span>人物</button><button data-tab="resort"><span>🏔</span>雪场</button><button data-tab="trip"><span>🧳</span>行程</button><button data-tab="log"><span>📖</span>记录</button></nav>
  <script type="module" src="start.js?v=20"></script>
</body>
</html>
