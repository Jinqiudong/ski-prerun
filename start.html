<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="雪场预滑">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f7fe8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>雪场预滑</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --glass: rgba(14, 22, 34, .66); --ink: #f4f7fb; --muted: #b9c4d3; --accent: #2f7fe8; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#bcd3ee, #eef2f7 60%); font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; color: var(--ink); }
    #c { position: fixed; left: 0; right: 0; top: 0; height: 58vh; width: 100%; display: block; touch-action: none; }
    .glass { background: var(--glass); border: 1px solid rgba(255,255,255,.16); border-radius: 16px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    #head { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    #head b { font-size: 17px; } #head small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    #who { position: fixed; top: calc(46.5vh); left: 0; right: 0; text-align: center; color: #142033; font-size: 22px; font-weight: 700; text-shadow: 0 1px 3px rgba(255,255,255,.8); pointer-events: none; }
    #sheet { position: fixed; left: 0; right: 0; bottom: 0; top: 52vh; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); overflow-y: auto; border-radius: 20px 20px 0 0; }
    h3 { margin: 6px 4px 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
    .row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .row::-webkit-scrollbar { display: none; }
    .card { flex: 0 0 96px; height: 92px; box-sizing: border-box; border-radius: 14px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.14); color: var(--ink); font: inherit; padding: 8px; cursor: pointer; position: relative; display: flex; flex-direction: column; justify-content: space-between; text-align: left; }
    .card.on { border-color: var(--accent); background: rgba(47,127,232,.25); }
    .card[disabled] { opacity: .45; cursor: default; }
    .card b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card small { font-size: 11px; color: var(--muted); }
    .card .dots { display: flex; gap: 3px; }
    .card .dots i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); }
    .card .del { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.35); color: #fff; font-size: 13px; cursor: pointer; }
    .btns { display: flex; gap: 8px; margin-top: 14px; }
    .btns button { flex: 1; font: inherit; font-size: 15px; white-space: nowrap; font-weight: 600; border-radius: 12px; padding: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,.22); color: var(--ink); background: rgba(255,255,255,.1); }
    .btns .go { background: var(--accent); border-color: var(--accent); color: #fff; }
    .seg { display: flex; gap: 6px; }
    .seg button { flex: 1; font: inherit; font-size: 14px; color: var(--ink); background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.14); border-radius: 12px; padding: 9px 6px; cursor: pointer; }
    .seg button.on { border-color: var(--accent); background: rgba(47,127,232,.25); font-weight: 600; }
    .part { margin: 4px 0 10px; }
    .part .lbl { font-size: 14px; margin: 0 4px 6px; display: flex; justify-content: space-between; }
    .sw { flex: 0 0 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); cursor: pointer; padding: 0; }
    .sw.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
    .sw.pick { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); position: relative; overflow: hidden; }
    .sw.pick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    #name { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: var(--ink); }
    .resort { display: flex; justify-content: space-between; align-items: center; width: 100%; box-sizing: border-box; margin-bottom: 8px; font: inherit; color: var(--ink); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 14px; padding: 12px 14px; cursor: pointer; text-align: left; }
    .resort b { font-size: 16px; display: block; } .resort small { color: var(--muted); font-size: 12px; }
    .resort[disabled] { opacity: .45; cursor: default; }
    /* Tabs along the bottom: rider, resorts (the conquest map), journal. */
    #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); background: rgba(14,22,34,.88); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,.12); }
    #tabs button { flex: 1; font: inherit; font-size: 12px; color: #9aa6b6; background: none; border: 0; padding: 4px; cursor: pointer; display: grid; justify-items: center; gap: 2px; }
    #tabs button span { font-size: 22px; } #tabs button.on { color: #fff; font-weight: 700; }
    #tabs .langSwitch button { flex: none; display: block; padding: 4px 9px; font: 600 12px Oswald, sans-serif; color: #22344d; }
    #tabs .langSwitch button.on { color: #fdfbf6; background: #22344d; }
    #sheet { bottom: 62px !important; }
    #world, #records { position: fixed; inset: 0; bottom: 62px; z-index: 5; }
    #world { background: #f3efe8; } #world canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #ctags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .ctag { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; gap: 6px; align-items: baseline; background: none; border: 0; padding: 2px 4px; white-space: nowrap; cursor: pointer; font: 500 11px Oswald, sans-serif; letter-spacing: .28em; color: #7b736a; }
    .ctag b { font-weight: 500; } .ctag small { font: 600 12px "Cormorant Garamond", serif; letter-spacing: 0; color: #b6463b; }
    .ctag.on { color: #22344d; } .ctag.on b { border-bottom: 1.5px solid #b6463b; }
    #records { background: #f6efe3; color: #3d3a36; overflow-y: auto; padding: env(safe-area-inset-top) 14px 0; font-family: "Noto Serif SC", serif; }
    #recSec { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; font: 18px "Cormorant Garamond", "Noto Serif SC", serif; color: #6f675e; } #recSec::after { content: ""; flex: 1; height: 1px; background: #d9cdb9; }
    #recList { padding: 0 0 24px; display: grid; gap: 10px; }
    .rec { display: grid; grid-template-columns: 76px 1fr; column-gap: 12px; row-gap: 5px; padding: 10px; background: #fdfbf6; box-shadow: 0 6px 14px rgba(90,70,40,.12); }
    .rec .thumb { grid-row: 1 / span 4; background: center/cover; min-height: 76px; }
    .rec .row1 { display: flex; justify-content: space-between; align-items: baseline; } .rec b { font: 600 19px "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; } .rec small { color: #8a8278; font-size: 12px; }
    .rec .bar { height: 6px; border-radius: 3px; background: #e6dccb; overflow: hidden; } .rec .bar i { display: block; height: 100%; background: #22344d; }
    .rec .recBtns { display: flex; gap: 8px; flex-wrap: wrap; } .rec .recBtns:empty { display: none; }
    .rec button { font: 14px "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; background: #fdfbf6; border: 1px solid #cbbfa9; border-radius: 999px; padding: 4px 12px; cursor: pointer; justify-self: start; }
    #jMap { position: fixed; inset: 0; bottom: 62px; z-index: 15; background: #e9edf2; } #jMap canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #jMap .bar { position: absolute; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top)); display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 14px; background: rgba(255,248,234,.95); color: #3b2a1a; box-shadow: 0 0 0 2px #8a5a35; font-size: 14px; }
    #jMap .bar b { flex: 1; } #jMap .bar button { font: inherit; color: #3b2a1a; background: #fff; border: 2px solid #8a5a35; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
    /* Trips: a quiet watercolour page (trips.js styles its insides). */
    #trips { position: fixed; inset: 0; bottom: 62px; z-index: 5; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(22px + env(safe-area-inset-top)) 18px 40px; background-color: #f6f1e7;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .07 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
    .langSwitch { align-self: center; flex: none; margin: 0 10px 0 2px; display: flex; border: 1px solid #b9ad99; border-radius: 999px; overflow: hidden; background: rgba(253,251,246,.92); }
    .langSwitch button { font: 600 12px Oswald, sans-serif; color: #22344d; background: none; border: 0; padding: 4px 10px; cursor: pointer; }
    .langSwitch button.on { background: #22344d; color: #fdfbf6; }
    #worldHead { position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 18px; right: 80px; color: #33302c; pointer-events: none; }
    #worldHead b { display: block; font: 600 30px/1.1 "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; } #worldHead small { display: block; font: 14px/1.4 "Cormorant Garamond", "Noto Serif SC", serif; color: #8a8278; margin-top: 4px; }
    #worldHead::before { content: "MY MOUNTAINS"; display: block; font: 500 10px Oswald, sans-serif; letter-spacing: .3em; color: #8a8278; margin-bottom: 4px; }
    #worldHome { position: absolute; right: 16px; top: calc(18px + env(safe-area-inset-top)); font: 14px "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; background: #fdfbf6; border: 1px solid #cbbfa9; border-radius: 999px; padding: 3px 12px; cursor: pointer; z-index: 2; }
    #worldCard { position: absolute; left: 14px; right: 14px; bottom: 18px; max-width: 520px; margin: 0 auto; padding: 14px 16px; background: #fdfbf6; color: #33302c; box-shadow: 0 8px 18px rgba(90,70,40,.18); display: grid; gap: 6px; font-family: "Noto Serif SC", serif; z-index: 3; }
    #worldCard b { font: 600 24px "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; } #worldCard small { color: #8a8278; font-size: 13px; }
    #worldCard .bar { height: 5px; border-radius: 3px; background: #e6dccb; overflow: hidden; } #worldCard .bar i { display: block; height: 100%; background: #22344d; }
    #worldCard button { font: 600 17px "Cormorant Garamond", "Noto Serif SC", serif; color: #fdfbf6; background: #22344d; border: 0; border-radius: 999px; padding: 9px; cursor: pointer; }
    #worldCredit { position: absolute; left: 8px; right: 8px; bottom: 2px; text-align: center; font-size: 9px; color: rgba(60,50,40,.5); pointer-events: none; }
    [hidden] { display: none !important; }
    #status { position: fixed; top: 26vh; left: 50%; transform: translateX(-50%); color: #142033; font-size: 14px; }
  </style>
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="head" class="glass"><div><b id="headTitle">选你的 Rider</b><small id="headSub">先选人物，再选雪场</small></div></div>
  <div id="status">人物加载中…</div>
  <div id="who"></div>
  <div id="sheet" class="glass">
    <section id="pickView">
      <h3>默认人物</h3><div class="row" id="defaults"></div>
      <h3>我的人物</h3><div class="row" id="mine"></div>
      <h3>哪只脚在前</h3><div class="seg" id="stance"><button data-s="regular">左脚在前 · Regular</button><button data-s="goofy">右脚在前 · Goofy</button></div>
      <div class="btns"><button id="editBtn">🎨 换装</button><button class="go" id="useBtn">用这个人物 ›</button></div>
    </section>
    <section id="editView" hidden>
      <div id="parts"></div>
      <h3>给人物取个名字</h3><input id="name" maxlength="16" placeholder="比如：周末的我">
      <div class="btns"><button id="cancelBtn">取消</button><button class="go" id="saveBtn">保存</button></div>
    </section>
  </div>
  <div id="world" hidden><canvas></canvas><div id="ctags"></div>
    <div id="worldHead"><b>去征服哪座山？</b><small>每座山一块真实的地形 · 滑得越多颜色越足，全滑遍插上旗 · 拖动转一圈，两指缩放</small></div><button id="worldHome">全图</button>
    <div id="worldCard" hidden></div><div id="worldCredit">地形 AWS Terrain Tiles · 雪道 © OpenStreetMap 贡献者 · 原型，以雪场官方地图为准</div></div>
  <div id="records" hidden><div id="memory"></div><div id="recSec">每个雪场</div><div id="recList"></div></div>
  <div id="jMap" hidden><canvas></canvas><div class="bar"><b></b><button id="jZoom">+</button><button id="jZoomOut">−</button><button id="jClose">×</button></div></div>
  <div id="trips" hidden></div>
  <nav id="tabs"><button data-tab="rider"><span>🧑</span>人物</button><button data-tab="resort"><span>🏔</span>雪场</button><button data-tab="trip"><span>🧳</span>行程</button><button data-tab="log"><span>📖</span>记录</button></nav>
  <script type="module" src="start.js?v=28"></script>
</body>
</html>
