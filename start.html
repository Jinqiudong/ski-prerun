<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="雪场预滑">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f7fe8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>雪场预滑</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #f6f1e7; --card: #fdfbf6; --ink: #33302c; --navy: #22344d; --muted: #8a8278; --line: #d9cdb9; --red: #b6463b; }
    html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font-family: "Noto Serif SC", serif;
      background: linear-gradient(rgba(246,241,231,0) 18%, rgba(246,241,231,.65) 40%, var(--paper) 56%), url(assets/wc/copper.jpg?v=1) center top / 100% auto no-repeat, var(--paper); }
    #c { position: fixed; left: 0; right: 0; top: 0; height: 58vh; width: 100%; display: block; touch-action: none; }
    .glass { background: var(--card); border: 0; box-shadow: 0 6px 14px rgba(90,70,40,.14); }
    #head { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 14px; right: 14px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; background: rgba(253,251,246,.9); }
    #setBtn { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid #cbbfa9; background: var(--card); color: var(--navy); font-size: 18px; cursor: pointer; }
    #head b { font: 600 22px/1.1 "Cormorant Garamond", "Noto Serif SC", serif; color: var(--navy); } #head small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    #status { color: var(--muted); }
    #who { position: fixed; top: calc(46.5vh); left: 0; right: 0; text-align: center; color: var(--navy); font: 600 26px "Cormorant Garamond", "Noto Serif SC", serif; text-shadow: 0 1px 3px rgba(253,251,246,.9); pointer-events: none; }
    #sheet { position: fixed; left: 0; right: 0; bottom: 0; top: 52vh; padding: 14px 16px calc(74px + env(safe-area-inset-bottom)); overflow-y: auto; background: var(--card); box-shadow: 0 -6px 18px rgba(90,70,40,.14); border-radius: 0; }
    h3 { display: flex; align-items: center; gap: 10px; margin: 8px 0 8px; font: 16px "Cormorant Garamond", "Noto Serif SC", serif; color: #6f675e; font-weight: 400; letter-spacing: .04em; }
    h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
    .row::-webkit-scrollbar { display: none; }
    .card { flex: 0 0 104px; height: 96px; box-sizing: border-box; background: var(--paper); border: 1px solid #e2d8c6; color: var(--ink); font: inherit; padding: 9px; cursor: pointer; position: relative; display: flex; flex-direction: column; justify-content: space-between; text-align: left; box-shadow: 0 3px 6px rgba(90,70,40,.08); }
    .card.on { border-color: var(--navy); box-shadow: 0 0 0 1.5px var(--navy), 0 3px 6px rgba(90,70,40,.12); }
    .card[disabled] { opacity: .45; cursor: default; }
    .card b { font: 600 17px "Cormorant Garamond", "Noto Serif SC", serif; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card small { font-size: 11px; color: var(--muted); }
    .card .dots { display: flex; gap: 3px; }
    .card .dots i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #fdfbf6; box-shadow: 0 0 0 1px #d9cdb9; }
    .card .del { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid #d9cdb9; background: var(--card); color: var(--muted); font-size: 12px; cursor: pointer; }
    .btns { display: flex; gap: 8px; margin-top: 16px; }
    .btns button { flex: 1; font: 600 17px "Cormorant Garamond", "Noto Serif SC", serif; white-space: nowrap; border-radius: 999px; padding: 10px; cursor: pointer; border: 1px solid #cbbfa9; color: var(--navy); background: var(--card); }
    .btns .go { background: var(--navy); border-color: var(--navy); color: #fdfbf6; }
    .seg { display: flex; gap: 8px; }
    .seg button { flex: 1; font: 15px "Cormorant Garamond", "Noto Serif SC", serif; color: var(--navy); background: var(--paper); border: 1px solid #e2d8c6; border-radius: 6px; padding: 9px 6px; cursor: pointer; }
    .seg button.on { background: var(--navy); border-color: var(--navy); color: #fdfbf6; font-weight: 600; }
    .part { margin: 4px 0 12px; }
    .part .lbl { font: 16px "Cormorant Garamond", "Noto Serif SC", serif; color: #6f675e; margin: 0 2px 6px; display: flex; justify-content: space-between; }
    .sw { flex: 0 0 34px; height: 34px; border-radius: 50%; border: 3px solid #fdfbf6; box-shadow: 0 0 0 1px #d9cdb9, 0 2px 4px rgba(90,70,40,.15); cursor: pointer; padding: 0; }
    .sw.on { box-shadow: 0 0 0 2px var(--navy), 0 2px 4px rgba(90,70,40,.15); }
    .sw.pick { background: conic-gradient(#b5524a, #d8b46a, #7f9e88, #8eaec4, #4a5f7a, #9a86ad, #b5524a); position: relative; overflow: hidden; }
    .sw.pick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    #name { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 6px; border: 1px solid #cbbfa9; background: var(--paper); color: var(--ink); }
    /* Tabs along the bottom: rider, resorts (the conquest map), journal. */
    #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; padding: 8px 6px calc(6px + env(safe-area-inset-bottom)); background: #fbfaf7; box-shadow: 0 -4px 12px rgba(60,70,90,.08); }
    #tabs::before { content: ""; position: absolute; left: 0; right: 0; top: -15px; height: 16px; pointer-events: none;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 16' preserveAspectRatio='none'><path d='M0 16 L0 11 L22 6 L40 9 L62 2 L80 8 L104 5 L120 10 L146 3 L170 9 L190 6 L214 11 L236 4 L258 9 L282 6 L300 10 L326 2 L350 8 L372 5 L400 9 L400 16Z' fill='%23fbfaf7'/><path d='M0 11 L22 6 L40 9 L62 2 L80 8 L104 5 L120 10 L146 3 L170 9 L190 6 L214 11 L236 4 L258 9 L282 6 L300 10 L326 2 L350 8 L372 5 L400 9' fill='none' stroke='%23c9d3dd' stroke-width='1.2'/></svg>") 0 0 / 100% 100% no-repeat; }
    #tabs button { flex: 1; font: 13px "Cormorant Garamond", "Noto Serif SC", serif; color: #9a9188; background: none; border: 0; padding: 2px; cursor: pointer; display: grid; justify-items: center; gap: 1px; }
    #tabs button svg { width: 30px; height: 30px; filter: grayscale(.85) opacity(.55); transition: filter .2s, transform .2s; }
    #tabs button.on { color: var(--navy); font-weight: 600; } #tabs button.on svg { filter: none; transform: translateY(-2px); }
    #tabs .langSwitch { align-self: center; flex: none; margin: 0 6px 0 2px; display: flex; border: 1px solid #cbbfa9; border-radius: 999px; overflow: hidden; background: var(--card); }
    #tabs .langSwitch button { flex: none; display: block; padding: 4px 9px; font: 600 12px Oswald, sans-serif; color: var(--navy); }
    #tabs .langSwitch button.on { color: #fdfbf6; background: var(--navy); }
    #sheet { bottom: 62px !important; }
    #world, #records { position: fixed; inset: 0; bottom: 62px; z-index: 5; }
    #world { background: #f3efe8; } #world canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #ctags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .ctag { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; gap: 6px; align-items: baseline; background: none; border: 0; padding: 2px 4px; white-space: nowrap; cursor: pointer; font: 500 11px Oswald, sans-serif; letter-spacing: .28em; color: #7b736a; }
    .ctag b { font-weight: 500; } .ctag small { font: 600 12px "Cormorant Garamond", serif; letter-spacing: 0; color: #b6463b; }
    .ctag.on { color: #22344d; } .ctag.on b { border-bottom: 1.5px solid #b6463b; }
    .cmark { position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap; }
    .cmark.town { font: italic 500 12px "Cormorant Garamond", serif; color: #22344d; opacity: .8; }
    .cmark.group { font: 500 10px Oswald, sans-serif; font-style: normal; letter-spacing: .25em; text-transform: uppercase; color: #6f675e; opacity: 1; }
    .cmark.drive { font: 600 10.5px "Cormorant Garamond", "Noto Serif SC", serif; color: #6e2f36; background: rgba(253,251,246,.85); padding: 0 5px; border-radius: 8px; }
    .cmark.city { font: 500 10px Oswald, sans-serif; letter-spacing: .25em; color: #b6463b; transform-origin: 0 0; }
    #records { background: #f6efe3; color: #3d3a36; overflow-y: auto; padding: env(safe-area-inset-top) 14px 0; font-family: "Noto Serif SC", serif; }
    #recSec { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; font: 18px "Cormorant Garamond", "Noto Serif SC", serif; color: #6f675e; } #recSec::after { content: ""; flex: 1; height: 1px; background: #d9cdb9; }
    #recList { padding: 0 0 24px; display: grid; gap: 10px; }
    .rec { display: grid; grid-template-columns: 76px 1fr; column-gap: 12px; row-gap: 5px; padding: 10px; background: #fdfbf6; box-shadow: 0 6px 14px rgba(90,70,40,.12); }
    .rec .thumb { grid-row: 1 / span 4; background: center/cover; min-height: 76px; }
    .rec .row1 { display: flex; justify-content: space-between; align-items: baseline; } .rec b { font: 600 19px "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; } .rec small { color: #8a8278; font-size: 12px; }
    .rec .bar { height: 6px; border-radius: 3px; background: #e6dccb; overflow: hidden; } .rec .bar i { display: block; height: 100%; background: #22344d; }
    .rec .recBtns { display: flex; gap: 8px; flex-wrap: wrap; } .rec .recBtns:empty { display: none; }
    .rec button { font: 14px "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; background: #fdfbf6; border: 1px solid #cbbfa9; border-radius: 999px; padding: 4px 12px; cursor: pointer; justify-self: start; }
    #jMap { position: fixed; inset: 0; bottom: 62px; z-index: 15; background: #e9edf2; } #jMap canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #jMap .bar { position: absolute; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top)); display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 14px; background: rgba(255,248,234,.95); color: #3b2a1a; box-shadow: 0 0 0 2px #8a5a35; font-size: 14px; }
    #jMap .bar b { flex: 1; } #jMap .bar button { font: inherit; color: #3b2a1a; background: #fff; border: 2px solid #8a5a35; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
    /* Trips: a quiet watercolour page (trips.js styles its insides). */
    #trips { position: fixed; inset: 0; bottom: 62px; z-index: 5; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(22px + env(safe-area-inset-top)) 18px 40px; background-color: #f6f1e7;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .07 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
    #worldHead { position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 18px; right: 80px; color: #33302c; pointer-events: none; }
    #worldHead b { display: block; font: 600 30px/1.1 "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; } #worldHead small { display: block; font: 14px/1.4 "Cormorant Garamond", "Noto Serif SC", serif; color: #8a8278; margin-top: 4px; }
    #worldHead::before { content: "MY MOUNTAINS"; display: block; font: 500 10px Oswald, sans-serif; letter-spacing: .3em; color: #8a8278; margin-bottom: 4px; }
    #worldHome { position: absolute; right: 16px; top: calc(18px + env(safe-area-inset-top)); font: 14px "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; background: #fdfbf6; border: 1px solid #cbbfa9; border-radius: 999px; padding: 3px 12px; cursor: pointer; z-index: 2; }
    #worldCard { position: absolute; left: 14px; right: 14px; bottom: 18px; max-width: 520px; margin: 0 auto; padding: 14px 16px; background: #fdfbf6; color: #33302c; box-shadow: 0 8px 18px rgba(90,70,40,.18); display: grid; gap: 6px; font-family: "Noto Serif SC", serif; z-index: 3; }
    #worldCard b { font: 600 24px "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; } #worldCard small { color: #8a8278; font-size: 13px; }
    #worldCard .bar { height: 5px; border-radius: 3px; background: #e6dccb; overflow: hidden; } #worldCard .bar i { display: block; height: 100%; background: #22344d; }
    #worldCard button { font: 600 17px "Cormorant Garamond", "Noto Serif SC", serif; color: #fdfbf6; background: #22344d; border: 0; border-radius: 999px; padding: 9px; cursor: pointer; }
    #worldCredit { position: absolute; left: 8px; right: 8px; bottom: 2px; text-align: center; font-size: 9px; color: rgba(60,50,40,.5); pointer-events: none; }
    [hidden] { display: none !important; }
    #status { position: fixed; top: 26vh; left: 50%; transform: translateX(-50%); color: #142033; font-size: 14px; }
  </style>
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs><filter id="wct" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="1.2" result="d"/><feGaussianBlur in="d" stdDeviation=".25"/></filter></defs></svg>
  <canvas id="c"></canvas>
  <div id="head" class="glass"><div><b id="headTitle">选你的穿搭</b><small id="headSub">先选一套穿搭，再选雪场</small></div><button id="setBtn" aria-label="设置">⚙</button></div>
  <div id="status">穿搭加载中…</div>
  <div id="who"></div>
  <div id="sheet" class="glass">
    <section id="pickView">
      <h3>穿搭模版</h3><div class="row" id="defaults"></div>
      <h3>我的穿搭</h3><div class="row" id="mine"></div>
      <h3>哪只脚在前</h3><div class="seg" id="stance"><button data-s="regular">左脚在前 · Regular</button><button data-s="goofy">右脚在前 · Goofy</button></div>
      <div class="btns"><button id="editBtn">🎨 改颜色</button><button class="go" id="useBtn">穿这套去滑 ›</button></div>
    </section>
    <section id="editView" hidden>
      <div id="parts"></div>
      <h3>给这套穿搭取个名字</h3><input id="name" maxlength="16" placeholder="比如：周末粉雪">
      <div class="btns"><button id="cancelBtn">取消</button><button class="go" id="saveBtn">保存</button></div>
    </section>
  </div>
  <div id="world" hidden><canvas></canvas><div id="ctags"></div>
    <div id="worldHead"><b>去征服哪座山？</b><small>每座山一块真实的地形 · 滑得越多颜色越足，全滑遍插上旗 · 拖动转一圈，两指缩放</small></div><button id="worldHome">全图</button>
    <div id="worldCard" hidden></div><div id="worldCredit">地形 AWS Terrain Tiles · 雪道 © OpenStreetMap 贡献者 · 原型，以雪场官方地图为准</div></div>
  <div id="records" hidden><div id="memory"></div><div id="recSec">每个雪场</div><div id="recList"></div></div>
  <div id="jMap" hidden><canvas></canvas><div class="bar"><b></b><button id="jZoom">+</button><button id="jZoomOut">−</button><button id="jClose">×</button></div></div>
  <div id="trips" hidden></div>
  <nav id="tabs"><button data-tab="rider"><svg viewBox="0 0 32 32"><g filter="url(#wct)"><path d="M10 30 L11 19 C11 15 21 15 21 19 L22 30Z" fill="#7f9e88"/><circle cx="16" cy="10.5" r="6.2" fill="#22344d"/><rect x="10.4" y="9" width="11.2" height="3.6" rx="1.8" fill="#c98f9f"/><path d="M6 30 h20" stroke="#8eaec4" stroke-width="2.6" stroke-linecap="round"/></g></svg>人物</button><button data-tab="resort"><svg viewBox="0 0 32 32"><g filter="url(#wct)"><path d="M2 28 L12 11 L17 18 L21 12 L30 28Z" fill="#8eaec4"/><path d="M12 11 L15 16 L13.5 15.5 L12 17 L10 15Z M21 12 L23.5 16.5 L21.5 15.5 L20 17 L19 15.5Z" fill="#fbfaf7"/><path d="M2 28 L12 11 L17 18 L21 12 L30 28" fill="none" stroke="#22344d" stroke-width="1.3" stroke-linejoin="round"/><path d="M4 28 h24" stroke="#4a6a5c" stroke-width="2" stroke-linecap="round"/></g></svg>雪场</button><button data-tab="trip"><svg viewBox="0 0 32 32"><g filter="url(#wct)"><rect x="3" y="9" width="26" height="15" rx="2" fill="#efe6d6" stroke="#22344d" stroke-width="1.2"/><rect x="3" y="9" width="26" height="4.2" rx="1.5" fill="#22344d"/><path d="M22 13.5 V24" stroke="#b9a98f" stroke-width="1.1" stroke-dasharray="1.6 1.6"/><path d="M7 19 h7 M7 21.5 h5" stroke="#6e2f36" stroke-width="1.4" stroke-linecap="round"/><path d="M14 18 l3 -2 l1.5 .6 l-2.6 2.2" fill="#b6463b"/></g></svg>行程</button><button data-tab="log"><svg viewBox="0 0 32 32"><g filter="url(#wct)"><rect x="7" y="4" width="18" height="20" rx="2" fill="#d9e2ea" transform="rotate(-8 16 14)"/><rect x="6" y="7" width="20" height="22" rx="2" fill="#fbfaf7" stroke="#22344d" stroke-width="1.2"/><path d="M8.5 22 L13 15 L16 19 L19 14.5 L23.5 22Z" fill="#8eaec4"/><circle cx="21" cy="11.5" r="2" fill="#b6463b" opacity=".85"/></g></svg>记录</button></nav>
  <script type="module" src="start.js?v=33"></script>
</body>
</html>
