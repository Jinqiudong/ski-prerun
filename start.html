<html lang="zh-CN">
<head>

  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">

  <title>雪场预滑</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #f6f1e7; --card: #fdfbf6; --ink: #33302c; --navy: #22344d; --muted: #8a8278; --line: #d9cdb9; --red: #b6463b; }
    html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); font-family: "Noto Serif SC", serif;
      background: linear-gradient(rgba(246,241,231,0) 18%, rgba(246,241,231,.65) 40%, var(--paper) 56%), url(assets/wc/copper.jpg?v=1) center top / 100% auto no-repeat, var(--paper); }
    #stage { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; height: 56vh; overflow: hidden; box-shadow: 0 8px 18px rgba(90,70,40,.18);
      background: linear-gradient(rgba(246,241,231,0) 50%, #eef0ee 78%), url(assets/wc/copper.jpg?v=1) 50% 0 / auto 82% no-repeat, #eef0ee; }
    #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #head { position: absolute; top: 12px; left: 14px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; text-shadow: 0 0 10px rgba(253,251,246,.95), 0 0 3px rgba(253,251,246,.9); pointer-events: none; }
    #head button { pointer-events: auto; }
    /* your avatar, top right: tap for settings (pick another avatar there) */
    #setBtn { position: relative; width: 52px; height: 52px; padding: 0; border-radius: 50%; border: 3px solid #fffdf8; background: #e6ebee; box-shadow: 0 4px 10px rgba(40,30,20,.2); cursor: pointer; }
    #setBtn img { width: 100%; height: 100%; border-radius: 50%; display: block; }
    #setBtn i { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; background: #fdfbf6; font: 13px/20px sans-serif; font-style: normal; color: #22344d; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    #head b { font: 600 24px/1.1 "Cormorant Garamond", "Noto Serif SC", serif; color: var(--navy); } #head small { display: block; color: #5f5a52; font-size: 12px; margin-top: 2px; }
    #status { position: absolute; top: 45%; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 14px; }
    #who { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; color: var(--navy); font: 600 24px "Cormorant Garamond", "Noto Serif SC", serif; text-shadow: 0 0 8px rgba(253,251,246,.95); pointer-events: none; }
    #stance { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 0; border-radius: 999px; overflow: hidden; box-shadow: 0 3px 8px rgba(40,30,20,.18); }
    #stance button { flex: none; font: 600 14px "Cormorant Garamond", "Noto Serif SC", serif; color: var(--navy); background: rgba(253,251,246,.95); border: 0; border-radius: 0; padding: 7px 14px; cursor: pointer; }
    #stance button.on { background: var(--navy); color: #fdfbf6; }
    #editBtn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 64px; padding: 8px 4px; font: 13px/1.25 "Cormorant Garamond", "Noto Serif SC", serif; color: var(--navy); background: rgba(253,251,246,.95); border: 0; border-radius: 12px; box-shadow: 0 3px 8px rgba(40,30,20,.18); cursor: pointer; text-align: center; }
    #editBtn img { display: block; width: 30px; height: 30px; margin: 0 auto 2px; }
    .tools { display: flex; gap: 10px; justify-content: flex-end; margin: 2px 0 6px; }
    .tools button { width: 44px; height: 44px; padding: 6px; border-radius: 50%; border: 1px solid #e2d8c6; background: var(--card); cursor: pointer; }
    .tools img, #saveBtn img { width: 100%; height: 100%; display: block; }
    #saveBtn img { width: 22px; height: 22px; display: inline-block; vertical-align: -5px; margin-right: 6px; filter: brightness(0) invert(1); }
    #useBtn { position: absolute; right: 12px; bottom: 10px; width: 58px; height: 58px; padding: 9px; background: var(--navy); border: 0; border-radius: 50%; box-shadow: 0 4px 10px rgba(34,52,77,.3); cursor: pointer; }
    #useBtn svg { width: 100%; height: 100%; display: block; }
    #chars .card { height: 58px; flex-basis: 120px; flex-direction: row; align-items: center; gap: 10px; justify-content: flex-start; }
    body.editing #stance, body.editing #editBtn, body.editing #useBtn { display: none; }
    #sheet { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: calc(100px + env(safe-area-inset-bottom)) !important; top: calc(56vh + 22px + env(safe-area-inset-top)); padding: 4px 16px 16px; overflow-y: auto; background: transparent; }
    h3 { display: flex; align-items: center; gap: 10px; margin: 8px 0 8px; font: 16px "Cormorant Garamond", "Noto Serif SC", serif; color: #6f675e; font-weight: 400; letter-spacing: .04em; }
    h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .row { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
    .row::-webkit-scrollbar { display: none; }
    .card { flex: 0 0 104px; height: 96px; box-sizing: border-box; background: var(--paper); border: 1px solid #e2d8c6; color: var(--ink); font: inherit; padding: 9px; cursor: pointer; position: relative; display: flex; flex-direction: column; justify-content: space-between; text-align: left; box-shadow: 0 3px 6px rgba(90,70,40,.08); }
    .card.on { border-color: var(--navy); box-shadow: 0 0 0 1.5px var(--navy), 0 3px 6px rgba(90,70,40,.12); }
    .card[disabled] { opacity: .45; cursor: default; }
    .card b { font: 600 17px "Cormorant Garamond", "Noto Serif SC", serif; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card small { font-size: 11px; color: var(--muted); }
    .card .dots { display: flex; gap: 3px; }
    .card .dots i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #fdfbf6; box-shadow: 0 0 0 1px #d9cdb9; }
    .card .del { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid #d9cdb9; background: var(--card); color: var(--muted); font-size: 12px; cursor: pointer; }
    .btns { display: flex; gap: 8px; margin-top: 16px; }
    .btns button { flex: 1; font: 600 17px "Cormorant Garamond", "Noto Serif SC", serif; white-space: nowrap; border-radius: 999px; padding: 10px; cursor: pointer; border: 1px solid #cbbfa9; color: var(--navy); background: var(--card); }
    .btns .go { background: var(--navy); border-color: var(--navy); color: #fdfbf6; }
    .seg { display: flex; gap: 8px; }
    .seg button { flex: 1; font: 15px "Cormorant Garamond", "Noto Serif SC", serif; color: var(--navy); background: var(--paper); border: 1px solid #e2d8c6; border-radius: 6px; padding: 9px 6px; cursor: pointer; }
    .seg button.on { background: var(--navy); border-color: var(--navy); color: #fdfbf6; font-weight: 600; }
    .part { margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; } .part .row { flex: 1; min-width: 0; }
    .part .ico { flex: none; width: 44px; height: 44px; object-fit: contain; }
    .part .lbl { font: 16px "Cormorant Garamond", "Noto Serif SC", serif; color: #6f675e; margin: 0 2px 6px; display: flex; justify-content: space-between; }
    .sw { flex: 0 0 34px; height: 34px; border-radius: 50%; border: 3px solid #fdfbf6; box-shadow: 0 0 0 1px #d9cdb9, 0 2px 4px rgba(90,70,40,.15); cursor: pointer; padding: 0; }
    .sw.on { box-shadow: 0 0 0 2px var(--navy), 0 2px 4px rgba(90,70,40,.15); }
    .sw.pick { background: conic-gradient(#b5524a, #d8b46a, #7f9e88, #8eaec4, #4a5f7a, #9a86ad, #b5524a); position: relative; overflow: hidden; }
    .sw.pick input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    #name { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 6px; border: 1px solid #cbbfa9; background: var(--paper); color: var(--ink); }
    /* Tabs along the bottom: rider, resorts (the conquest map), journal. */
    /* The tabs: a frosted pill floating over the page; on the map it folds into one round button while you explore. */
    #tabs { position: fixed; left: 14px; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 20; display: flex; padding: 7px; border-radius: 40px;
      background: rgba(253,251,246,.8); -webkit-backdrop-filter: blur(14px) saturate(1.1); backdrop-filter: blur(14px) saturate(1.1); box-shadow: 0 10px 26px rgba(40,50,70,.18), inset 0 0 0 1px rgba(255,255,255,.7);
      transition: left .35s cubic-bezier(.3,1.3,.5,1), width .35s, border-radius .35s, padding .35s; }
    #tabs button { flex: 1; font: 12px "Cormorant Garamond", "Noto Serif SC", serif; color: #4a453f; background: none; border: 0; border-radius: 32px; padding: 6px 0 5px; cursor: pointer; display: grid; justify-items: center; gap: 1px; transition: background .25s, color .25s; }
    #tabs button img { width: 30px; height: 30px; transition: transform .2s; }
    #tabs button.on { background: #6f879c; color: #fdfbf6; font-weight: 600; box-shadow: inset 0 2px 6px rgba(20,30,45,.25); } #tabs button.on img { transform: translateY(-1px); filter: drop-shadow(0 0 1.5px rgba(255,255,255,.9)); }
    #tabs.shut { left: calc(100% - 82px); padding: 0; border-radius: 50%; }
    #tabs.shut button:not(.on) { display: none; }
    #tabs.shut button.on { width: 64px; height: 64px; flex: none; padding: 0; place-content: center; font-size: 0; background: none; box-shadow: none; }
    #tabs.shut button.on img { width: 38px; height: 38px; filter: none; }
    #tabs .langSwitch { align-self: center; flex: none; margin: 0 6px 0 2px; display: flex; border: 1px solid #cbbfa9; border-radius: 999px; overflow: hidden; background: var(--card); }
    #tabs .langSwitch button { flex: none; display: block; padding: 4px 9px; font: 600 12px Oswald, sans-serif; color: var(--navy); }
    #tabs .langSwitch button.on { color: #fdfbf6; background: var(--navy); }
    #world, #records { position: fixed; inset: 0; z-index: 5; } #records { padding-bottom: 96px; box-sizing: border-box; }
    #world { background: #eef2f5; } #world canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #ctags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .ctag { position: absolute; left: 0; top: 0; pointer-events: auto; display: flex; gap: 6px; align-items: baseline; background: rgba(253,251,246,.9); border: 0; padding: 3px 8px; white-space: nowrap; cursor: pointer; font: 500 11px Oswald, sans-serif; letter-spacing: .24em; color: #22344d; box-shadow: 0 2px 6px rgba(60,45,30,.15); }
    .ctag::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 16px; background: rgba(34,52,77,.45); }
    .ctag b { font-weight: 500; } .ctag small { font: 600 12px "Cormorant Garamond", serif; letter-spacing: 0; color: #b6463b; }
    .ctag.on { color: #22344d; } .ctag.on b { border-bottom: 1.5px solid #b6463b; }
    .cmark { position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap; }
    .cmark.town { font: italic 500 12px "Cormorant Garamond", serif; color: #22344d; opacity: .8; }
    .cmark.group { font: 500 10px Oswald, sans-serif; font-style: normal; letter-spacing: .25em; text-transform: uppercase; color: #6f675e; opacity: 1; }
    .cmark.drive { font: italic 600 12px "Cormorant Garamond", "Noto Serif SC", serif; color: #8a3b34; text-shadow: 0 0 3px #f6f1e7, 0 0 3px #f6f1e7, 0 0 2px #f6f1e7; }
    .cmark.city { font: 500 10px Oswald, sans-serif; letter-spacing: .25em; color: #b6463b; transform-origin: 0 0; }
    #records { background: #f6efe3; color: #3d3a36; overflow-y: auto; padding: env(safe-area-inset-top) 14px 110px; font-family: "Noto Serif SC", serif; }
    #recSec { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; font: 18px "Cormorant Garamond", "Noto Serif SC", serif; color: #6f675e; } #recSec::after { content: ""; flex: 1; height: 1px; background: #d9cdb9; }
    #recList { padding: 0 0 24px; display: grid; gap: 10px; }
    .rec { display: grid; grid-template-columns: 76px 1fr; column-gap: 12px; row-gap: 5px; padding: 10px; background: #fdfbf6; box-shadow: 0 6px 14px rgba(90,70,40,.12); }
    .rec .thumb { grid-row: 1 / span 4; background: center/cover; min-height: 76px; }
    .rec .row1 { display: flex; justify-content: space-between; align-items: baseline; } .rec b { font: 600 19px "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; } .rec small { color: #8a8278; font-size: 12px; }
    .rec .bar { height: 6px; border-radius: 3px; background: #e6dccb; overflow: hidden; } .rec .bar i { display: block; height: 100%; background: #22344d; }
    .rec .recBtns { display: flex; gap: 8px; flex-wrap: wrap; } .rec .recBtns:empty { display: none; }
    .rec button { font: 14px "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; background: #fdfbf6; border: 1px solid #cbbfa9; border-radius: 999px; padding: 4px 12px; cursor: pointer; justify-self: start; }
    #jMap { position: fixed; inset: 0; bottom: 0; z-index: 15; background: #e9edf2; } #jMap canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #jMap .bar { position: absolute; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top)); display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-radius: 14px; background: rgba(255,248,234,.95); color: #3b2a1a; box-shadow: 0 0 0 2px #8a5a35; font-size: 14px; }
    #jMap .bar b { flex: 1; } #jMap .bar button { font: inherit; color: #3b2a1a; background: #fff; border: 2px solid #8a5a35; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
    /* Trips: a quiet watercolour page (trips.js styles its insides). */
    #trips { position: fixed; inset: 0; bottom: 0; z-index: 5; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(22px + env(safe-area-inset-top)) 18px 120px; background-color: #f6f1e7;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .07 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
    #worldHead { position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 18px; right: 80px; color: #33302c; pointer-events: none; }
    #worldHead b { display: block; font: 600 30px/1.1 "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; } #worldHead small { display: block; font: 14px/1.4 "Cormorant Garamond", "Noto Serif SC", serif; color: #8a8278; margin-top: 4px; }
    #worldHead::before { content: "MY MOUNTAINS"; display: block; font: 500 10px Oswald, sans-serif; letter-spacing: .3em; color: #8a8278; margin-bottom: 4px; }
    #worldHome { position: absolute; right: 16px; top: calc(18px + env(safe-area-inset-top)); font: 14px "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; background: #fdfbf6; border: 1px solid #cbbfa9; border-radius: 999px; padding: 3px 12px; cursor: pointer; z-index: 2; }
    #worldCard { position: absolute; left: 14px; right: 92px; bottom: calc(14px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; padding: 14px 16px 14px; border-radius: 22px; background: rgba(253,251,246,.9); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      box-shadow: 0 10px 26px rgba(40,50,70,.16), inset 0 0 0 1px rgba(255,255,255,.7); color: #33302c; display: grid; gap: 6px; font-family: "Noto Serif SC", serif; z-index: 3; }
    #worldCard .st { position: absolute; right: 10px; top: -22px; width: 62px; height: 62px; transform: rotate(10deg); filter: drop-shadow(0 3px 4px rgba(90,70,40,.2)); }
    #worldCard b { font: 600 24px "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; padding-right: 56px; } #worldCard small { color: #8a8278; font-size: 13px; }
    #worldCard .bar { height: 5px; border-radius: 3px; background: #e6dccb; overflow: hidden; } #worldCard .bar i { display: block; height: 100%; background: #6f879c; }
    #worldCard button { font: 600 17px "Cormorant Garamond", "Noto Serif SC", serif; color: #fdfbf6; background: #22344d; border: 0; border-radius: 999px; padding: 10px; cursor: pointer; box-shadow: 0 4px 10px rgba(34,52,77,.25); }
    /* an opened mountain: the heading and the map's small words step aside, only its own name stays; a chip
       top left goes back to all of them */
    #worldHead, .cmark, .ctag, #compass { transition: opacity .35s; }
    #world.focus #worldHead, #world.focus .cmark, #world.focus .ctag:not(.on), #world.focus #compass { opacity: 0 !important; pointer-events: none; }
    #allBtn { position: absolute; z-index: 4; left: 16px; top: calc(16px + env(safe-area-inset-top)); font: 600 15px "Cormorant Garamond", "Noto Serif SC", serif; color: #22344d; background: rgba(253,251,246,.94); border: 0; border-radius: 999px; padding: 6px 14px; box-shadow: 0 4px 10px rgba(40,50,70,.15); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .35s; }
    #world.focus #allBtn { opacity: 1; pointer-events: auto; }
    #compass { position: absolute; left: 18px; bottom: calc(96px + env(safe-area-inset-bottom)); width: 54px; height: 54px; pointer-events: none; opacity: .9; }
    #worldCredit { position: absolute; left: 8px; right: 90px; bottom: 2px; text-align: center; font-size: 9px; color: rgba(60,50,40,.5); pointer-events: none; }
    [hidden] { display: none !important; }
  </style>

<body>
  <svg width="0" height="0" style="position:absolute"><defs><filter id="wct" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="1.2" result="d"/><feGaussianBlur in="d" stdDeviation=".25"/></filter></defs></svg>
  <!-- The rider on a card at the top: turn her round, flip the stance, change colours, go. -->
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="head"><div><b id="headTitle">选你的穿搭</b><small id="headSub">先选一套穿搭，再选雪场</small></div><button id="setBtn" aria-label="设置"><img alt=""><i>⚙</i></button></div>
    <div id="status">穿搭加载中…</div>
    <div id="who"></div>
    <div class="seg" id="stance"><button data-s="regular">Regular</button><button data-s="goofy">Goofy</button></div>
    <button id="editBtn">🎨 改颜色</button>
    <button class="go" id="useBtn" aria-label="穿这套去滑"><svg viewBox="0 0 40 40"><g filter="url(#wct)"><path d="M9 29 L29 11" stroke="#fdfbf6" stroke-width="6" stroke-linecap="round"/><circle cx="16" cy="23" r="1.6" fill="#22344d"/><circle cx="22" cy="17" r="1.6" fill="#22344d"/><path d="M6 19 L13 12 M4 13 L9 8 M14 34 L19 29" stroke="#b9cfe0" stroke-width="2" stroke-linecap="round"/><path d="M27 9 L33 7 L31 13" fill="none" stroke="#fdfbf6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg></button>
  </div>
  <div id="sheet">
    <section id="pickView">
      <h3>角色</h3><div class="row" id="chars"></div>
      <h3>穿搭推荐</h3><div class="row" id="defaults"></div>
      <h3>我的穿搭</h3><div class="row" id="mine"></div>
    </section>
    <section id="editView" hidden>
      <div class="tools"><button id="shuffleBtn" aria-label="随机搭配"><img src="assets/icons/shuffle.png?v=1" alt=""></button><button id="resetBtn" aria-label="重置"><img src="assets/icons/reset.png?v=1" alt=""></button></div>
      <div id="parts"></div>
      <h3>给这套穿搭取个名字</h3><input id="name" maxlength="16" placeholder="比如：周末粉雪">
      <div class="btns"><button id="cancelBtn">取消</button><button class="go" id="saveBtn"><img src="assets/icons/hanger.png?v=1" alt="">保存</button></div>
    </section>
  </div>
  <div id="world" hidden><canvas></canvas><div id="ctags"></div>
