<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-title" content="雪场预滑">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f7fe8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>雪场预滑</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@400;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/start.css?v=1">
  <script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs><filter id="wct" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="1.2" result="d"/><feGaussianBlur in="d" stdDeviation=".25"/></filter></defs></svg>
  <!-- The rider on a card at the top: turn her round, flip the stance, change colours, go. -->
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="head"><div><b id="headTitle">选你的穿搭</b><small id="headSub">先选一套穿搭，再选雪场</small></div><button id="setBtn" aria-label="设置"><img alt=""><i>⚙</i></button></div>
    <div id="status">穿搭加载中…</div>
    <div id="who"></div>
    <div class="seg" id="stance"><button data-s="regular">Regular</button><button data-s="goofy">Goofy</button></div>
    <button id="editBtn">🎨 改颜色</button>
    <button class="go" id="useBtn" aria-label="穿这套去滑"><svg viewBox="0 0 40 40"><g filter="url(#wct)"><path d="M9 29 L29 11" stroke="#fdfbf6" stroke-width="6" stroke-linecap="round"/><circle cx="16" cy="23" r="1.6" fill="#22344d"/><circle cx="22" cy="17" r="1.6" fill="#22344d"/><path d="M6 19 L13 12 M4 13 L9 8 M14 34 L19 29" stroke="#b9cfe0" stroke-width="2" stroke-linecap="round"/><path d="M27 9 L33 7 L31 13" fill="none" stroke="#fdfbf6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg></button>
  </div>
  <div id="sheet">
    <section id="pickView">
      <h3>角色</h3><div class="row" id="chars"></div>
      <h3>穿搭推荐</h3><div class="row" id="defaults"></div>
      <h3>我的穿搭</h3><div class="row" id="mine"></div>
    </section>
    <section id="editView" hidden>
      <div class="etabs" id="etabs"></div><div id="epane"></div>
      <div class="tools" id="etools"><button id="shuffleBtn" aria-label="随机搭配"><img src="assets/icons/shuffle.png?v=1" alt=""></button><button id="resetBtn" aria-label="重置"><img src="assets/icons/reset.png?v=1" alt=""></button></div>
      <div id="parts"></div>
      <h3>给这套穿搭取个名字</h3><input id="name" maxlength="16" placeholder="比如：周末粉雪">
      <div class="btns"><button id="cancelBtn">取消</button><button class="go" id="saveBtn"><img src="assets/icons/hanger.png?v=1" alt="">保存</button></div>
    </section>
  </div>
  <div id="world" hidden><canvas></canvas><div id="ctags"></div>
    <div id="worldHead"><b>去征服哪座山？</b><small>每座山一块真实的地形 · 滑得越多颜色越足，全滑遍插上旗 · 拖动转一圈，两指缩放</small></div><button id="worldHome">全图</button>
    <div id="worldCard" hidden></div><button id="allBtn">‹ 全部雪场</button><svg id="compass" viewBox="0 0 60 60" aria-hidden="true"><g fill="none" stroke="#6b5a4a" stroke-width="1"><circle cx="30" cy="32" r="16"/><circle cx="30" cy="32" r="12" stroke-dasharray="1.5 2"/></g><path d="M30 12 L33 32 L30 52 L27 32Z" fill="#8a7563"/><path d="M30 12 L33 32 L27 32Z" fill="#b6463b"/><path d="M10 32 L30 29 L50 32 L30 35Z" fill="#a8998a"/><text x="30" y="9" font-size="8" text-anchor="middle" fill="#6b5a4a" font-family="Cormorant Garamond">N</text></svg><div id="worldCredit">地形 AWS Terrain Tiles · 雪道 © OpenStreetMap 贡献者 · 原型，以雪场官方地图为准</div></div>
  <div id="records" hidden><div id="memory"></div><div id="recSec">每个雪场</div><div id="recList"></div></div>
  <div id="jMap" hidden><canvas></canvas><div class="bar"><b></b><button id="jZoom">+</button><button id="jZoomOut">−</button><button id="jClose">×</button></div></div>
  <div id="trips" hidden></div>
  <nav id="tabs"><button data-tab="rider"><img src="assets/icons/rider.png?v=1" alt="">人物</button><button data-tab="resort"><img src="assets/icons/resorts.png?v=1" alt="">雪场</button><button data-tab="trip"><img src="assets/icons/trips.png?v=1" alt="">行程</button><button data-tab="log"><img src="assets/icons/memory.png?v=1" alt="">记录</button></nav>
  <a id="resume" hidden><img src="assets/icons/snowboard.png?v=1" alt=""><span><b></b> <small></small></span><i></i><em><svg viewBox="0 0 10 12" width="16" height="18"><path d="M1 0L10 6L1 12Z" fill="#fdfbf6"/></svg></em></a>
  <script type="module" src="src/start/start.js?v=1"></script>
</body>
</html>
